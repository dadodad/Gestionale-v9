<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Interventi"><link rel="manifest" href="manifest.json"><title>Gestione Interventi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:600}header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}.brand{font-size:20px;font-weight:800}.search{margin-top:10px;width:100%;padding:12px 14px;border-radius:12px;border:0;background:#fff;color:#111}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;padding:8px 6px;font-size:12px;color:#667}.tabs .active{color:#111827;font-weight:800}.main{padding:16px 16px 100px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 5px #00000012}.metric .n{font-size:24px;font-weight:800;margin-top:5px}.metric small{color:#6b7280}.primary{background:#111827;color:white;width:100%}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.section{margin:18px 0 10px;font-size:17px;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e7eb}.muted{color:#6b7280;font-size:13px}.amount{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#f8fafc;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.chart{height:220px;background:white;border-radius:16px;padding:10px}.barwrap{height:180px;display:flex;align-items:end;gap:7px;padding:10px 4px}.bar{flex:1;min-width:10px;background:#111827;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#6b7280}.empty{padding:28px;text-align:center;color:#6b7280}.fab{position:fixed;right:18px;bottom:76px;z-index:25;width:58px;height:58px;border-radius:50%;background:#111827;color:#fff;font-size:28px;box-shadow:0 5px 18px #0004}.hidden{display:none!important}.dashboard-logo{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:0 1px 5px #00000012;display:flex;justify-content:center;align-items:center}.dashboard-logo img{display:block;width:100%;max-width:620px;height:auto;max-height:120px;object-fit:contain}.dashboard-head{background:#fff;border-radius:16px;padding:16px;margin-bottom:4px;box-shadow:0 1px 5px #00000012}.dashboard-title{font-size:22px;font-weight:800}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{max-width:650px;border-radius:20px}.filters{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="brand">Gestione Interventi</div><input id="globalSearch" class="search" placeholder="🔎 Cerca lavori, clienti, interventi..."></header>
<main class="main" id="app"></main>
<button class="fab" id="fab" type="button" aria-label="Nuovo lavoro">＋</button>
<nav class="tabs"><button data-tab="home" class="active">🏠<br>Home</button><button data-tab="jobs">📁<br>Lavori</button><button data-tab="clients">👥<br>Clienti</button><button data-tab="more">⚙️<br>Altro</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='gestionale_interventi_v2';
const uid=()=>('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],cats:[],jobs:[],interventions:[],expenses:[],payments:[],seqJob:0,seqInt:0};db.jobs.forEach(j=>{if(typeof j.invoice!=='boolean')j.invoice=false});
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const euro=n=>(Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function yearFilter(){let y=new Date().getFullYear();return `<select id="fy"><option value="all">Tutti gli anni</option>${[y-2,y-1,y,y+1].map(x=>`<option>${x}</option>`).join('')}</select>`}
function monthFilter(){return `<select id="fm"><option value="all">Tutti i mesi</option>${['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'].map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}</select>`}
function jobTotal(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+(Number(i.cost)||0),0)}
function jobExpenses(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+db.expenses.filter(e=>e.intId===i.id).reduce((a,e)=>a+(Number(e.amount)||0),0),0)}
function jobProfit(j){return jobTotal(j)-jobExpenses(j)}
function jobPayments(j){return db.payments.filter(p=>p.jobId===j.id).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function jobToCollect(j){return jobTotal(j)-jobPayments(j)}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'—'}
function catName(id){let c=db.cats.find(c=>c.id===id);return c?c.desc:'—'}
function render(){let tab=document.querySelector('.tabs .active')?.dataset.tab||'home'; if(tab==='home')home();else if(tab==='jobs')jobs();else if(tab==='clients')clients();else more()}
function filteredInterventions(){let q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();let arr=db.interventions.filter(i=>{let j=db.jobs.find(x=>x.id===i.jobId)||{};let c=db.clients.find(x=>x.id===j.clientId)||{};let sub=db.clients.find(x=>x.id===i.subclientId)||{};let cat=db.cats.find(x=>x.id===i.catId)||{};let exps=db.expenses.filter(e=>e.intId===i.id);let pays=db.payments.filter(p=>p.jobId===i.jobId);let hay=[i.num,i.date,i.start,i.end,i.request,i.work,i.minutes,i.attachment?.name||'',j.num,j.date,j.invoice?'fattura':'no fattura',c.name,c.city,c.street,c.fraz,c.branch,c.close,sub.name,sub.city,sub.street,sub.fraz,sub.branch,sub.close,cat.code,cat.desc,...exps.flatMap(e=>[e.desc,e.amount]),...pays.flatMap(x=>[x.date,x.amount,x.method,x.note])].join(' ').toLowerCase();return !q||hay.includes(q)});return arr.sort((a,b)=>{let d=(b.date||'').localeCompare(a.date||'');return d||((Number(b.num)||0)-(Number(a.num)||0))})}
function interventionCard(i){let j=db.jobs.find(x=>x.id===i.jobId)||{};let sub=db.clients.find(c=>c.id===i.subclientId)||{};let hasAttachment=!!i.attachment?.data;return `<div class="item" onclick="editInt('${i.id}')"><div class="row"><div><b>${esc(sub.name||'Nessun sottocliente')}</b><div class="muted">${esc(sub.city||'')} ${sub.city&&sub.street?'· ':''}${esc(sub.street||'')}</div></div><span class="amount">${euro(i.cost)}</span></div><div class="row" style="margin-top:8px"><span class="muted">${esc(i.date||'')} · ${esc(clientName(j.clientId))}</span><span>${hasAttachment?'📎':''}</span></div><div class="muted">${esc(catName(i.catId))}${i.request?' · '+esc(i.request):''}</div></div>`}
function searchResults(){let arr=filteredInterventions();document.getElementById('app').innerHTML=`<div class="section">Interventi trovati (${arr.length})</div><div class="list">${arr.map(interventionCard).join('')||'<div class="empty">Nessun intervento trovato.</div>'}</div>`}
function home(){let app=document.getElementById('app');app.innerHTML=`<div class="dashboard-head"><div><div class="dashboard-title">Dashboard</div><div class="muted">Panoramica lavori, incassi e guadagni</div></div></div><div class="section">Riepilogo</div><div class="grid" id="metrics"></div><div class="section">Lavori recenti</div><div id="recent" class="list"></div><div class="section">Filtra per periodo</div><div class="filters">${yearFilter()}${monthFilter()}</div><div class="section">Andamento guadagni</div><div class="chart" id="chart"></div>`;document.getElementById('fy').onchange=updateDash;document.getElementById('fm').onchange=updateDash;updateDash()}
function getPeriodJobs(){let y=document.getElementById('fy')?.value||'all',m=document.getElementById('fm')?.value||'all';return db.jobs.filter(j=>{let d=new Date(j.date+'T00:00:00');return (y==='all'||d.getFullYear()==y)&&(m==='all'||d.getMonth()+1==m)})}
function updateDash(){let js=getPeriodJobs(),tot=js.reduce((a,j)=>a+jobTotal(j),0),sp=js.reduce((a,j)=>a+jobExpenses(j),0),payments=js.reduce((a,j)=>a+jobPayments(j),0),toCollect=tot-payments,inv=js.filter(j=>j.invoice===true),noinv=js.filter(j=>j.invoice!==true),invGain=inv.reduce((a,j)=>a+jobProfit(j),0),noinvGain=noinv.reduce((a,j)=>a+jobProfit(j),0);document.getElementById('metrics').innerHTML=`<div class="card metric"><small>💰 Guadagni</small><div class="n">${euro(tot-sp)}</div></div><div class="card metric"><small>💸 Spese</small><div class="n">${euro(sp)}</div></div><div class="card metric"><small>💳 Da incassare</small><div class="n">${euro(toCollect)}</div></div><div class="card metric"><small>🧾 Guadagni fattura</small><div class="n">${euro(invGain)}</div></div><div class="card metric"><small>💶 Guadagni senza fattura</small><div class="n">${euro(noinvGain)}</div></div><div class="card metric"><small>📁 Lavori</small><div class="n">${js.length}</div></div><div class="card metric"><small>🔧 Interventi</small><div class="n">${db.interventions.filter(i=>js.some(j=>j.id===i.jobId)).length}</div></div>`;let months=Array.from({length:12},(_,i)=>({m:i+1,v:0}));let y=document.getElementById('fy').value;let chartJobs=db.jobs.filter(j=>{let d=new Date(j.date+'T00:00:00');return y==='all'||d.getFullYear()==y});chartJobs.forEach(j=>{let m=new Date(j.date+'T00:00:00').getMonth();months[m].v+=jobProfit(j)});let max=Math.max(1,...months.map(x=>x.v));document.getElementById('chart').innerHTML=`<div class="barwrap">${months.map((x,i)=>`<div class="bar" style="height:${Math.max(3,x.v/max*150)}px" title="${euro(x.v)}"><span>${['G','F','M','A','M','G','L','A','S','O','N','D'][i]}</span></div>`).join('')}</div>`;document.getElementById('recent').innerHTML=js.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(jobCard).join('')||'<div class="empty">Nessun lavoro nel periodo selezionato.</div>'}
function jobCard(j){return `<div class="item" onclick="openJob('${j.id}')"><div class="row"><b>${esc(clientName(j.clientId))}</b><span class="amount">${euro(jobProfit(j))}</span></div><div class="muted">${esc(j.date)} · ${db.interventions.filter(i=>i.jobId===j.id).length} interventi · spese ${euro(jobExpenses(j))} · ${j.invoice?'🧾 Fattura':'💶 No fattura'}</div></div>`}
function jobs(){let arr=filteredJobs();document.getElementById('app').innerHTML=`<div class="row"><div class="section">Lavori</div><button class="primary" id="newJobBtn" type="button">＋ Nuovo lavoro</button></div><div class="list">${arr.map(jobCard).join('')||'<div class="empty">Nessun lavoro trovato.</div>'}</div>`}
function clients(){document.getElementById('app').innerHTML=`<div class="row"><div class="section">Clienti</div><button class="primary" onclick="newClient()">＋ Cliente</button></div><div class="list">${db.clients.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">${esc(c.city)} · ${esc(c.street)} · ${esc(c.branch||'')}</div><div class="muted">Frazionario: ${esc(c.fraz)} · Chiusura: ${esc(c.close||'')}</div><div class="actions"><button class="secondary" onclick="editClient('${c.id}')">✏️ Modifica</button><button class="danger" onclick="deleteClient('${c.id}')">🗑️ Elimina</button></div></div>`).join('')||'<div class="empty">Inserisci il primo cliente.</div>'}</div>`} 
function editClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;modal(`<h2>Modifica cliente</h2>${[['cn','Nome',c.name],['city','Città',c.city],['street','Via',c.street],['fraz','Frazionario',c.fraz],['branch','Numero filiale',c.branch],['close','Orario chiusura',c.close]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" value="${esc(x[2]||'')}"></div>`).join('')}<div class="actions"><button class="secondary" onclick="closeModal();clients()">Annulla</button><button class="primary" onclick="saveEditClient('${id}')">Salva</button></div>`)}
function saveEditClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;['cn','city','street','fraz','branch','close'].forEach((k,idx)=>{let v=document.getElementById(k)?.value||'';c[['name','city','street','fraz','branch','close'][idx]]=v});save();closeModal();clients()}
function deleteClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;if(db.jobs.some(j=>j.clientId===id)||db.interventions.some(i=>i.subclientId===id)){alert('Questo cliente è utilizzato da lavori o interventi e non può essere eliminato. Puoi modificarlo.');return}if(confirm(`Eliminare il cliente "${c.name}"?`)){db.clients=db.clients.filter(x=>x.id!==id);save();clients()}}
function more(){document.getElementById('app').innerHTML=`<div class="section">Categorie intervento</div><div class="card"><button class="primary" onclick="newCat()">＋ Nuova categoria</button></div><div class="list">${db.cats.map(c=>`<div class="item"><div class="row"><b>${esc(c.code)}</b><span class="amount">${euro(c.amount)}</span></div><div>${esc(c.desc)}</div><div class="actions"><button class="secondary" onclick="editCat('${c.id}')">✏️ Modifica</button><button class="danger" onclick="deleteCat('${c.id}')">🗑️ Elimina</button></div></div>`).join('')||'<div class="empty">Nessuna categoria.</div>'}</div><div class="section">Backup</div><div class="card"><button class="primary" onclick="exportDB()">📤 Esporta backup JSON</button><div class="field"><label>Ripristina backup</label><input id="backupFile" type="file" accept="application/json,.json" onchange="importDB(event)"></div><div class="muted">Il backup contiene lavori, interventi, spese, pagamenti, clienti, categorie e allegati.</div></div>`} 
function editCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;modal(`<h2>Modifica categoria</h2><div class="field"><label>Codice categoria</label><input id="ccode" value="${esc(c.code)}"></div><div class="field"><label>Descrizione</label><input id="cdesc" value="${esc(c.desc)}"></div><div class="field"><label>Importo</label><input id="camount" type="number" step="0.01" inputmode="decimal" value="${Number(c.amount)||0}"></div><div class="actions"><button class="secondary" onclick="closeModal();more()">Annulla</button><button class="primary" onclick="saveEditCat('${id}')">Salva</button></div>`)}
function saveEditCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;c.code=document.getElementById('ccode')?.value||'';c.desc=document.getElementById('cdesc')?.value||'';c.amount=Number(document.getElementById('camount')?.value)||0;save();closeModal();more()}
function deleteCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;if(db.interventions.some(i=>i.catId===id)){alert('Questa categoria è utilizzata da uno o più interventi e non può essere eliminata. Puoi modificarla.');return}if(confirm(`Eliminare la categoria "${c.desc}"?`)){db.cats=db.cats.filter(x=>x.id!==id);save();more()}}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')};
function newJob(){let next=db.seqJob+1;if(!db.clients.length){modal(`<h2>Nuovo lavoro</h2><div class="card">Prima di creare un lavoro devi inserire almeno un cliente.</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Annulla</button><button type="button" class="primary" onclick="newClient()">＋ Inserisci cliente</button></div>`);return}modal(`<h2>Nuovo lavoro</h2><div class="field"><label>Cliente</label><select id="jc">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="jd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fattura</label><div class="row"><span class="muted">Il lavoro è fatturato?</span><input id="jinv" type="checkbox" style="width:24px;height:24px;flex:0 0 auto"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="saveJob(${next})">Crea lavoro</button></div>`)}
function saveJob(num){const clientEl=document.getElementById('jc');const dateEl=document.getElementById('jd');if(!clientEl||!dateEl||!clientEl.value||!dateEl.value){alert('Seleziona il cliente e la data.');return}db.seqJob=num;db.jobs.push({id:uid(),num,date:dateEl.value,clientId:clientEl.value,invoice:!!document.getElementById('jinv')?.checked});save();closeModal();render()}
function openJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;let ints=db.interventions.filter(x=>x.jobId===id).sort((a,b)=>{let d=(b.date||'').localeCompare(a.date||'');return d||((Number(b.num)||0)-(Number(a.num)||0))});modal(`<h2>${esc(clientName(j.clientId))}</h2><div class="card"><b>${esc(clientName(j.clientId))}</b><div class="muted">${esc(j.date)} · ${j.invoice?'🧾 Fattura':'💶 No fattura'}</div><div class="section">Totali</div><div class="row"><span>Interventi<br><b>${euro(jobTotal(j))}</b></span><span>Spese<br><b>${euro(jobExpenses(j))}</b></span><span>Guadagno<br><b>${euro(jobProfit(j))}</b></span><span>Da incassare<br><b>${euro(jobToCollect(j))}</b></span></div></div><div class="actions"><button class="secondary" onclick="editJob('${id}')">✏️ Modifica lavoro</button><button class="danger" onclick="deleteJob('${id}')">🗑️ Elimina lavoro</button></div><div class="section">Interventi</div><div class="list">${ints.map(i=>{let sub=db.clients.find(c=>c.id===i.subclientId)||{};let hasAttachment=!!i.attachment?.data;return `<div class="item"><div class="row"><div><b>${esc(sub.name||'Nessun sottocliente')}</b><div class="muted">${esc(sub.city||'')}${sub.city&&sub.street?' · ':''}${esc(sub.street||'')}</div></div><div style="text-align:right"><div class="amount">${euro(i.cost)}</div><div class="muted">${esc(i.date||'')}</div></div></div><div class="muted" style="margin-top:7px">${esc(catName(i.catId))}${i.request?' · '+esc(i.request):''} ${hasAttachment?' · 📎':''}</div><div class="actions"><button class="secondary" onclick="editInt('${i.id}')">Apri / modifica</button><button class="danger" onclick="deleteInt('${i.id}')">Elimina</button></div></div>`}).join('')||'<div class="empty">Nessun intervento.</div>'}</div><div class="section">Pagamenti ricevuti</div><div class="list">${db.payments.filter(p=>p.jobId===id).map(p=>`<div class="item"><div class="row"><span>${esc(p.date||'')}</span><span class="amount">${euro(p.amount)}</span></div><div class="muted">${esc(p.method||'')} ${p.note?'· '+esc(p.note):''}</div><div class="actions"><button class="secondary" onclick="editPayment('${p.id}')">Modifica</button><button class="danger" onclick="deletePayment('${p.id}')">Elimina</button></div></div>`).join('')||'<div class="empty">Nessun pagamento registrato.</div>'}</div><div class="actions"><button class="secondary" onclick="closeModal()">Chiudi</button><button class="primary" onclick="newInt('${id}')">＋ Intervento</button><button class="primary" onclick="addPayment('${id}')">＋ Pagamento</button></div>`)}
function editJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;modal(`<h2>Modifica lavoro</h2><div class="field"><label>Cliente</label><select id="ejc">${db.clients.map(c=>`<option value="${c.id}" ${c.id===j.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="ejd" type="date" value="${esc(j.date)}"></div><div class="field"><label>Fattura</label><div class="row"><span class="muted">Il lavoro è fatturato?</span><input id="ejinv" type="checkbox" ${j.invoice?'checked':''} style="width:24px;height:24px;flex:0 0 auto"></div></div><div class="actions"><button class="secondary" onclick="openJob('${id}')">Annulla</button><button class="primary" onclick="saveEditJob('${id}')">Salva modifiche</button></div>`)}
function saveEditJob(id){let j=db.jobs.find(x=>x.id===id),c=document.getElementById('ejc'),d=document.getElementById('ejd');if(!j||!c||!d||!d.value)return;j.clientId=c.value;j.date=d.value;j.invoice=!!document.getElementById('ejinv')?.checked;save();openJob(id)}
function deleteJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;if(!confirm(`Eliminare il lavoro #${j.num} e tutti i suoi interventi e spese?`))return;let intIds=db.interventions.filter(i=>i.jobId===id).map(i=>i.id);db.expenses=db.expenses.filter(e=>!intIds.includes(e.intId));db.interventions=db.interventions.filter(i=>i.jobId!==id);db.jobs=db.jobs.filter(x=>x.id!==id);save();closeModal();render()}
function newInt(jobId){if(!db.cats.length){alert('Prima inserisci almeno una categoria.');return}let j=db.jobs.find(x=>x.id===jobId),num=db.seqInt+1;if(!j)return;modal(`<h2>Nuovo intervento</h2><div class="card"><b>Cliente: ${esc(clientName(j.clientId))}</b></div><div class="field"><label>Data</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Ora inizio</label><input id="istart" type="time"></div><div class="field"><label>Ora fine</label><input id="iend" type="time"></div><div class="field"><label>Sottocliente</label><select id="isub"><option value="">— Nessuno —</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Categoria intervento</label><select id="icat" onchange="showCost()">${db.cats.map(c=>`<option value="${c.id}">${esc(c.code)} - ${esc(c.desc)}</option>`).join('')}</select></div><div class="field"><label>Costo intervento</label><input id="icost" readonly></div><div class="field"><label>Richiesta cliente</label><textarea id="ireq"></textarea></div><div class="field"><label>Lavoro svolto</label><textarea id="iwork"></textarea></div><div class="field"><label>File allegato</label><input id="ifile" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><div class="actions"><button class="secondary" onclick="openJob('${jobId}')">Annulla</button><button class="primary" onclick="saveInt('${jobId}',${num})">Salva intervento</button></div>`);showCost()}
function showCost(){const catEl=document.getElementById('icat'),costEl=document.getElementById('icost');if(!catEl||!costEl)return;let c=db.cats.find(c=>c.id===catEl.value);costEl.value=c?Number(c.amount).toFixed(2)+' €':''}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);let r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type||'application/octet-stream',data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
async function saveInt(jobId,num){const dateEl=document.getElementById('idate'),startEl=document.getElementById('istart'),endEl=document.getElementById('iend'),subEl=document.getElementById('isub'),catEl=document.getElementById('icat'),reqEl=document.getElementById('ireq'),workEl=document.getElementById('iwork'),fileEl=document.getElementById('ifile');if(!dateEl||!catEl||!dateEl.value){alert('Compila i dati dell’intervento.');return}let c=db.cats.find(c=>c.id===catEl.value),start=startEl?.value||'',end=endEl?.value||'',mins='';if(start&&end){let a=new Date('2000-01-01T'+start),b=new Date('2000-01-01T'+end);let d=(b-a)/60000;if(d<0)d+=1440;mins=d}let file=await readFileAsDataURL(fileEl?.files?.[0]);db.seqInt=num;db.interventions.push({id:uid(),jobId,num,date:dateEl.value,start,end,minutes:mins,subclientId:subEl?.value||'',catId:catEl.value,cost:Number(c?.amount||0),request:reqEl?.value||'',work:workEl?.value||'',attachment:file});try{save()}catch(e){db.interventions.pop();alert('Il file è troppo grande per essere salvato nel browser. Prova con un PDF o un file più piccolo.');return}openJob(jobId)}
function openAttachment(id){let i=db.interventions.find(x=>x.id===id);let a=i?.attachment;if(!a?.data){alert('Nessun allegato disponibile.');return}try{let parts=a.data.split(','),mime=a.type||'application/octet-stream',raw=atob(parts[1]),u8=new Uint8Array(raw.length);for(let n=0;n<raw.length;n++)u8[n]=raw.charCodeAt(n);let url=URL.createObjectURL(new Blob([u8],{type:mime}));let w=window.open(url,'_blank');if(!w){let link=document.createElement('a');link.href=url;link.download=a.name||'allegato';document.body.appendChild(link);link.click();link.remove()}setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('Impossibile aprire l’allegato.')}}
function editInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let j=db.jobs.find(x=>x.id===i.jobId);modal(`<h2>Modifica intervento #${i.num}</h2><div class="card"><b>Cliente: ${esc(clientName(j.clientId))}</b><div class="muted">Tempo: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'non calcolato'}</div></div><div class="field"><label>Data</label><input id="eidate" type="date" value="${esc(i.date)}"></div><div class="field"><label>Ora inizio</label><input id="eistart" type="time" value="${esc(i.start||'')}"></div><div class="field"><label>Ora fine</label><input id="eiend" type="time" value="${esc(i.end||'')}"></div><div class="field"><label>Sottocliente</label><select id="eisub"><option value="">— Nessuno —</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id===i.subclientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Categoria intervento</label><select id="eicat" onchange="showEditCost()">${db.cats.map(c=>`<option value="${c.id}" ${c.id===i.catId?'selected':''}>${esc(c.code)} - ${esc(c.desc)}</option>`).join('')}</select></div><div class="field"><label>Costo intervento</label><input id="eicost" readonly></div><div class="field"><label>Richiesta cliente</label><textarea id="er">${esc(i.request)}</textarea></div><div class="field"><label>Lavoro svolto</label><textarea id="ew">${esc(i.work)}</textarea></div><div class="field"><label>Allegato</label>${i.attachment?.data?`<div class="item"><b>${esc(i.attachment.name)}</b><div class="actions"><button class="secondary" onclick="openAttachment('${id}')">📎 Apri allegato</button><button class="danger" onclick="removeAttachment('${id}')">Elimina allegato</button></div></div>`:'<div class="muted">Nessun allegato</div>'}<input id="eifile" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><div class="section">Spese</div><div class="list">${db.expenses.filter(e=>e.intId===id).map(e=>`<div class="item"><div class="row"><span>${esc(e.desc)}</span><span class="amount">${euro(e.amount)}</span></div><div class="actions"><button class="secondary" onclick="editExpense('${e.id}')">Modifica</button><button class="danger" onclick="deleteExpense('${e.id}')">Elimina</button></div></div>`).join('')||'<div class="muted">Nessuna spesa</div>'}</div><div class="actions"><button class="secondary" onclick="openJob('${i.jobId}')">Indietro</button><button class="primary" onclick="addExpense('${id}')">＋ Spesa</button><button class="primary" onclick="saveEditInt('${id}')">Salva</button></div><div class="actions"><button class="danger" onclick="deleteInt('${id}')">🗑️ Elimina intervento</button></div>`);showEditCost()}
function showEditCost(){let c=db.cats.find(x=>x.id===document.getElementById('eicat')?.value);let el=document.getElementById('eicost');if(el)el.value=c?Number(c.amount).toFixed(2)+' €':''}
async function saveEditInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let date=document.getElementById('eidate'),start=document.getElementById('eistart'),end=document.getElementById('eiend'),sub=document.getElementById('eisub'),cat=document.getElementById('eicat'),req=document.getElementById('er'),work=document.getElementById('ew'),file=document.getElementById('eifile');if(!date?.value||!cat?.value)return;let mins='';if(start?.value&&end?.value){let a=new Date('2000-01-01T'+start.value),b=new Date('2000-01-01T'+end.value),d=(b-a)/60000;if(d<0)d+=1440;mins=d}i.date=date.value;i.start=start?.value||'';i.end=end?.value||'';i.minutes=mins;i.subclientId=sub?.value||'';i.catId=cat.value;i.cost=Number(db.cats.find(c=>c.id===cat.value)?.amount||0);i.request=req?.value||'';i.work=work?.value||'';let f=await readFileAsDataURL(file?.files?.[0]);if(f)i.attachment=f;try{save()}catch(e){alert('Il file è troppo grande per essere salvato.');return}editInt(id)}
function removeAttachment(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(confirm('Eliminare questo allegato?')){i.attachment=null;save();editInt(id)}}
function deleteInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(!confirm(`Eliminare l'intervento #${i.num} e tutte le sue spese?`))return;db.expenses=db.expenses.filter(e=>e.intId!==id);db.interventions=db.interventions.filter(x=>x.id!==id);save();openJob(i.jobId)}
function addExpense(intId){modal(`<h2>Nuova spesa</h2><div class="field"><label>Descrizione</label><input id="edesc"></div><div class="field"><label>Importo</label><input id="eamount" type="number" step="0.01" inputmode="decimal"></div><div class="actions"><button class="secondary" onclick="editInt('${intId}')">Annulla</button><button class="primary" onclick="saveExpense('${intId}')">Salva</button></div>`)}
function editExpense(id){let e=db.expenses.find(x=>x.id===id);if(!e)return;modal(`<h2>Modifica spesa</h2><div class="field"><label>Descrizione</label><input id="edesc" value="${esc(e.desc)}"></div><div class="field"><label>Importo</label><input id="eamount" type="number" step="0.01" inputmode="decimal" value="${Number(e.amount)||0}"></div><div class="actions"><button class="secondary" onclick="editInt('${e.intId}')">Annulla</button><button class="primary" onclick="saveEditedExpense('${id}')">Salva</button></div>`)}
function saveEditedExpense(id){let e=db.expenses.find(x=>x.id===id),d=document.getElementById('edesc'),a=document.getElementById('eamount');if(!e||!d||!d.value)return;e.desc=d.value;e.amount=Number(a?.value)||0;save();editInt(e.intId)}
function saveExpense(intId){const descEl=document.getElementById('edesc'),amountEl=document.getElementById('eamount');if(!descEl||!amountEl||!descEl.value){alert('Inserisci la descrizione della spesa.');return}db.expenses.push({id:uid(),intId,desc:descEl.value,amount:Number(amountEl.value)||0});save();editInt(intId)}
function deleteExpense(id){let e=db.expenses.find(x=>x.id===id);if(!e)return;if(confirm(`Eliminare la spesa "${e.desc}"?`)){db.expenses=db.expenses.filter(x=>x.id!==id);save();editInt(e.intId)}}
function addPayment(jobId){modal(`<h2>Nuovo pagamento</h2><div class="field"><label>Data</label><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Importo</label><input id="pamount" type="number" step="0.01" inputmode="decimal"></div><div class="field"><label>Metodo di pagamento</label><input id="pmethod" placeholder="Bonifico, contanti, POS..."></div><div class="field"><label>Note</label><textarea id="pnote"></textarea></div><div class="actions"><button class="secondary" onclick="openJob('${jobId}')">Annulla</button><button class="primary" onclick="savePayment('${jobId}')">Salva</button></div>`)}
function savePayment(jobId){let a=Number(document.getElementById('pamount')?.value)||0;if(a<=0){alert('Inserisci un importo valido.');return}db.payments.push({id:uid(),jobId,date:document.getElementById('pdate')?.value||'',amount:a,method:document.getElementById('pmethod')?.value||'',note:document.getElementById('pnote')?.value||''});save();openJob(jobId)}
function editPayment(id){let p=db.payments.find(x=>x.id===id);if(!p)return;modal(`<h2>Modifica pagamento</h2><div class="field"><label>Data</label><input id="pdate" type="date" value="${esc(p.date||'')}"></div><div class="field"><label>Importo</label><input id="pamount" type="number" step="0.01" inputmode="decimal" value="${Number(p.amount)||0}"></div><div class="field"><label>Metodo di pagamento</label><input id="pmethod" value="${esc(p.method||'')}"></div><div class="field"><label>Note</label><textarea id="pnote">${esc(p.note||'')}</textarea></div><div class="actions"><button class="secondary" onclick="openJob('${p.jobId}')">Annulla</button><button class="primary" onclick="saveEditPayment('${id}')">Salva</button></div>`)}
function saveEditPayment(id){let p=db.payments.find(x=>x.id===id);if(!p)return;let a=Number(document.getElementById('pamount')?.value)||0;if(a<=0){alert('Inserisci un importo valido.');return}p.date=document.getElementById('pdate')?.value||'';p.amount=a;p.method=document.getElementById('pmethod')?.value||'';p.note=document.getElementById('pnote')?.value||'';save();openJob(p.jobId)}
function deletePayment(id){let p=db.payments.find(x=>x.id===id);if(!p)return;if(confirm('Eliminare questo pagamento?')){db.payments=db.payments.filter(x=>x.id!==id);save();openJob(p.jobId)}}
function newClient(){modal(`<h2>Nuovo cliente</h2>${[['cn','Nome'],['city','Città'],['street','Via'],['fraz','Frazionario'],['branch','Numero filiale'],['close','Orario chiusura']].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}"></div>`).join('')}<div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="saveClient()">Salva</button></div>`)}
function saveClient(){const vals=['cn','city','street','fraz','branch','close'].map(id=>document.getElementById(id)?.value||'');db.clients.push({id:uid(),name:vals[0],city:vals[1],street:vals[2],fraz:vals[3],branch:vals[4],close:vals[5]});save();closeModal();clients()}
function newCat(){modal(`<h2>Nuova categoria intervento</h2><div class="field"><label>Codice categoria</label><input id="ccode"></div><div class="field"><label>Descrizione</label><input id="cdesc"></div><div class="field"><label>Importo</label><input id="camount" type="number" step="0.01" inputmode="decimal"></div><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="saveCat()">Salva</button></div>`)}
function saveCat(){const codeEl=document.getElementById('ccode'),descEl=document.getElementById('cdesc'),amountEl=document.getElementById('camount');if(!codeEl||!descEl||!descEl.value){alert('Inserisci almeno la descrizione della categoria.');return}db.cats.push({id:uid(),code:codeEl.value,desc:descEl.value,amount:Number(amountEl?.value)||0});save();closeModal();more()}
function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-gestionale.json';a.click()}
function importDB(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.interventions)||!Array.isArray(x.clients)){throw new Error('struttura')}db={clients:x.clients||[],cats:x.cats||[],jobs:x.jobs||[],interventions:x.interventions||[],expenses:x.expenses||[],payments:x.payments||[],seqJob:x.seqJob||0,seqInt:x.seqInt||0};save();render();alert('Backup importato correttamente.')}catch(_){alert('Backup non valido o danneggiato.')}};r.readAsText(f)}
document.addEventListener('DOMContentLoaded',()=>{const tabs=document.querySelectorAll('.tabs button');tabs.forEach(b=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));const search=document.getElementById('globalSearch');if(search)search.addEventListener('input',()=>{if(search.value.trim())searchResults();else render()});const fab=document.getElementById('fab');if(fab){fab.onclick=null;fab.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();newJob();});}document.addEventListener('click',function(ev){const b=ev.target.closest&&ev.target.closest('#newJobBtn');if(b){ev.preventDefault();newJob();}});const modalEl=document.getElementById('modal');if(modalEl)modalEl.addEventListener('click',e=>{if(e.target===modalEl)closeModal()});render();});
</script></body></html>
