<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:600}header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}.brand{font-size:20px;font-weight:800}.search{margin-top:10px;width:100%;padding:12px 14px;border-radius:12px;border:0;background:#fff;color:#111}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;padding:8px 6px;font-size:12px;color:#667}.tabs .active{color:#111827;font-weight:800}.main{padding:16px 16px 100px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 5px #00000012}.metric .n{font-size:24px;font-weight:800;margin-top:5px}.metric small{color:#6b7280}.primary{background:#111827;color:white;width:100%}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.section{margin:18px 0 10px;font-size:17px;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e7eb}.job-card{padding:10px 12px}.job-card .grid{gap:6px}.job-card .grid>div{min-width:0}.job-card b{font-size:14px}.job-card .job-value{font-size:14px;line-height:1.2;word-break:break-word}.muted{color:#6b7280;font-size:13px}.amount{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#f8fafc;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.chart{height:220px;background:white;border-radius:16px;padding:10px}.barwrap{height:180px;display:flex;align-items:end;gap:7px;padding:10px 4px}.bar{flex:1;min-width:10px;background:#111827;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#6b7280}.empty{padding:28px;text-align:center;color:#6b7280}.fab{position:fixed;right:18px;bottom:76px;z-index:25;width:58px;height:58px;border-radius:50%;background:#111827;color:#fff;font-size:28px;box-shadow:0 5px 18px #0004}.hidden{display:none!important}.dashboard-logo{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:0 1px 5px #00000012;display:flex;justify-content:center;align-items:center}.dashboard-logo img{display:block;width:100%;max-width:620px;height:auto;max-height:120px;object-fit:contain}.dashboard-head{background:#fff;border-radius:16px;padding:16px;margin-bottom:4px;box-shadow:0 1px 5px #00000012}.dashboard-title{font-size:22px;font-weight:800}.fixed-job{border-left:4px solid #111827}.collect-button{background:#fff;color:#dc2626;font-weight:800;font-size:16px;width:100%;border:2px solid #fecaca}.filter-button{background:#fff;color:#2563eb;font-weight:800;font-size:16px;width:100%;border:2px solid #bfdbfe}.print-only{display:none}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.quick-actions button{width:100%}.search-result-meta{margin-top:7px}.status-open{color:#1d4ed8}.status-progress{color:#b45309}.status-done{color:#047857}.status-closed{color:#374151}.status-cancel{color:#b91c1c}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}body.printing #printArea h1{font-size:24px;margin:0 0 8px}body.printing #printArea h2{font-size:18px;margin:20px 0 8px}body.printing #printArea .print-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #ddd;padding:6px 0}body.printing #printArea .print-total{font-weight:800}body.printing #printArea img{max-width:360px;max-height:100px;object-fit:contain;margin-bottom:16px}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{max-width:650px;border-radius:20px}.filters{grid-template-columns:repeat(2,1fr)}}

.intervention-table{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff}
.intervention-row{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;padding:11px 10px;border-bottom:1px solid #eef0f3;align-items:center;font-size:14px}
.intervention-row:last-child{border-bottom:0}.intervention-head{background:#f8fafc;font-size:12px;color:#6b7280}
@media(max-width:520px){.intervention-row{grid-template-columns:.9fr 1.2fr 1fr;font-size:13px;padding:10px 7px}}
</style></head><body>
<header><div class="brand">Gestione Interventi</div><input id="globalSearch" class="search" placeholder="🔎 Cerca interventi, clienti, sottoclienti..."></header>
<main class="main" id="app"></main>
<button class="fab" id="fab" type="button" aria-label="Nuovo lavoro">＋</button>
<nav class="tabs"><button data-tab="home" class="active">🏠<br>Home</button><button data-tab="jobs">📁<br>Lavori</button><button data-tab="anagrafica">👥<br>Anagrafica</button><button data-tab="more">⚙️<br>Altro</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div id="printArea" class="print-only"></div>
<script>
const KEY='gestionale_interventi_v2';
const uid=()=>('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],cats:[],jobs:[],interventions:[],expenses:[],payments:[],seqJob:0,seqInt:0};db.jobs.forEach(j=>{if(typeof j.invoice!=='boolean')j.invoice=false;if(typeof j.invoiceNo!=='string')j.invoiceNo='';if(typeof j.invoiceDate!=='string')j.invoiceDate='';if(typeof j.taxRate!=='number')j.taxRate=0;if(typeof j.fixed!=='boolean')j.fixed=false;if(typeof j.status!=='string')j.status='Aperto'});
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const euro=n=>(Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function yearFilter(){let y=new Date().getFullYear();return `<select id="fy"><option value="all">Tutti gli anni</option>${[y-2,y-1,y,y+1].map(x=>`<option>${x}</option>`).join('')}</select>`}
function monthFilter(){return `<select id="fm"><option value="all">Tutti i mesi</option>${['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'].map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}</select>`}
function jobTotal(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+(Number(i.cost)||0),0)}
function jobExpenses(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+db.expenses.filter(e=>e.intId===i.id).reduce((a,e)=>a+(Number(e.amount)||0),0),0)}
function jobTax(j){return jobTotal(j)*(Number(j.taxRate)||0)/100}
function jobProfit(j){return jobTotal(j)-jobExpenses(j)-jobTax(j)}
function jobPayments(j){return db.payments.filter(p=>p.jobId===j.id).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function jobToCollect(j){return jobTotal(j)-jobPayments(j)}
function paymentStatus(j){let due=jobToCollect(j);return due<=0?'🟢 Pagato':jobPayments(j)>0?'🟠 Parzialmente pagato':'🔴 Da incassare'}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'—'}
function catName(id){let c=db.cats.find(c=>c.id===id);return c?c.desc:'—'}
function render(){let tab=document.querySelector('.tabs .active')?.dataset.tab||'home'; if(tab==='home')home();else if(tab==='jobs')jobs();else if(tab==='anagrafica')anagrafica();else more()}
function filteredInterventions(){let q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();let terms=q.split(/\s+/).filter(Boolean);let arr=db.interventions.filter(i=>{let j=db.jobs.find(x=>x.id===i.jobId)||{};let c=db.clients.find(x=>x.id===j.clientId)||{};let sub=db.clients.find(x=>x.id===i.subclientId)||{};let cat=db.cats.find(x=>x.id===i.catId)||{};let exps=db.expenses.filter(e=>e.intId===i.id);let pays=db.payments.filter(p=>p.jobId===i.jobId);let hay=[i.num,i.date,i.start,i.end,i.request,i.work,i.minutes,i.attachment?.name||'',j.num,j.date,j.status,j.invoice?'fattura':'no fattura',c.name,c.city,c.street,c.fraz,c.branch,c.close,sub.name,sub.city,sub.street,sub.fraz,sub.branch,sub.close,cat.code,cat.desc,...exps.flatMap(e=>[e.desc,e.amount]),...pays.flatMap(x=>[x.date,x.amount,x.method,x.note])].join(' ').toLowerCase();return !terms.length||terms.every(term=>hay.includes(term))});return arr.sort((a,b)=>{let d=(b.date||'').localeCompare(a.date||'');return d||((Number(b.num)||0)-(Number(a.num)||0))})}
function interventionCard(i){let j=db.jobs.find(x=>x.id===i.jobId)||{};let sub=db.clients.find(c=>c.id===i.subclientId)||{};let hasAttachment=!!i.attachment?.data;return `<div class="item" onclick="editInt('${i.id}')"><div class="row"><div><b>${esc(sub.name||'Nessun sottocliente')}</b><div class="muted">${esc(sub.city||'')} ${sub.city&&sub.street?'· ':''}${esc(sub.street||'')}</div></div><span class="amount">${euro(i.cost)}</span></div><div class="search-result-meta muted">Lavoro #${esc(j.num||'—')} · ${esc(i.date||'')} · ${esc(clientName(j.clientId))} · ${paymentStatus(j)} ${hasAttachment?'· 📎':''}</div><div class="muted">${esc(catName(i.catId))}${i.request?' · '+esc(i.request):''}</div></div>`}
function renderHomeRecent(){let arr=db.interventions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((Number(b.num)||0)-(Number(a.num)||0))).slice(0,5);let el=document.getElementById('homeRecent');if(!el)return;el.innerHTML=arr.map(interventionCard).join('')||'<div class="empty">Nessun intervento registrato.</div>'}
function newIntChooser(){if(!db.jobs.length){modal('<h2>Nuovo intervento</h2><div class="card">Prima devi creare almeno un lavoro.</div><div class="actions"><button class="primary" onclick="closeModal();newJob()">＋ Nuovo lavoro</button></div>');return}let opts=db.jobs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((Number(b.num)||0)-(Number(a.num)||0))).map(j=>`<option value="${j.id}">#${esc(j.num)} · ${esc(clientName(j.clientId))} · ${esc(j.date||'')}</option>`).join('');modal(`<h2>Nuovo intervento</h2><div class="field"><label>Lavoro</label><select id="chooserJob">${opts}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="chooseNewInt()">Continua</button></div>`)}
function chooseNewInt(){let id=document.getElementById('chooserJob')?.value;if(id){closeModal();newInt(id)}}
function searchResults(){let arr=filteredInterventions();document.getElementById('app').innerHTML=`<div class="section">Interventi trovati (${arr.length})</div><div class="list">${arr.map(interventionCard).join('')||'<div class="empty">Nessun intervento trovato.</div>'}</div>`}
function clientSubclientFilter(){let cs=db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));let opts=cs.map(c=>`<option value="c:${c.id}">👤 ${esc(c.name)}</option>`).join('')+cs.map(c=>`<option value="s:${c.id}">↳ ${esc(c.name)}</option>`).join('');return `<select id="fclient"><option value="all">Tutti clienti e sottoclienti</option>${opts}</select>`}
function workStatusFilter(){return `<select id="fstatus"><option value="all">Tutti gli stati lavoro</option>${['Aperto','In corso','Completato','Chiuso','Annullato'].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select>`}
function paymentStatusFilter(){return `<select id="fpayment"><option value="all">Tutti gli stati pagamento</option><option value="unpaid">🔴 Da incassare</option><option value="partial">🟠 Parzialmente pagato</option><option value="paid">🟢 Pagato</option></select>`}
const HOME_FILTER_KEY='gestionale_home_filters_v1';
function getSavedHomeFilters(){try{return JSON.parse(localStorage.getItem(HOME_FILTER_KEY)||'null')||{}}catch(e){return {}}}
function saveHomeFilters(){let keep=document.getElementById('rememberFilters')?.checked;if(!keep){localStorage.removeItem(HOME_FILTER_KEY);return}localStorage.setItem(HOME_FILTER_KEY,JSON.stringify({remember:true,fy:document.getElementById('fy')?.value||'all',fm:document.getElementById('fm')?.value||'all',fclient:document.getElementById('fclient')?.value||'all',fstatus:document.getElementById('fstatus')?.value||'all',fpayment:document.getElementById('fpayment')?.value||'all'}))}
function restoreHomeFilters(){let s=getSavedHomeFilters();if(!s.remember)return;const vals={fy:s.fy,fm:s.fm,fclient:s.fclient,fstatus:s.fstatus,fpayment:s.fpayment};Object.entries(vals).forEach(([id,v])=>{let el=document.getElementById(id);if(el&&v!=null)el.value=v});let cb=document.getElementById('rememberFilters');if(cb)cb.checked=true}
function toggleHomeFilters(){let box=document.getElementById('homeFilters');if(box)box.classList.toggle('hidden')}
function home(){let app=document.getElementById('app');app.innerHTML=`<div class="dashboard-logo"><img src="logo.jpeg" alt="DG Servizi Tecnologici di Davide Geraci"></div><button type="button" class="collect-button" onclick="showToCollect()">💳 Da incassare</button><div style="margin-top:10px"><button type="button" class="filter-button" onclick="toggleHomeFilters()">🔎 Filtri</button></div><div id="homeFilters" class="card hidden" style="margin-top:10px"><div class="section" style="margin-top:0">Filtra riepilogo</div><label class="row" style="justify-content:flex-start;gap:8px;margin:4px 0 10px"><input id="rememberFilters" type="checkbox" style="width:auto;flex:none"><span><b>Mantieni in memoria i filtri</b></span></label><div class="filters">${yearFilter()}${monthFilter()}</div><div class="field"><label>Cliente / Sottocliente</label>${clientSubclientFilter()}<div class="muted" style="margin-top:5px">👤 Cliente = importo lavori · ↳ Sottocliente = importo interventi</div></div><div class="filters"><div class="field"><label>Stato lavoro</label>${workStatusFilter()}</div><div class="field"><label>Stato pagamento</label>${paymentStatusFilter()}</div></div></div><div class="quick-actions"><button class="primary" type="button" onclick="newJob()">＋ Nuovo lavoro</button><button class="secondary" type="button" onclick="newIntChooser()">🔧 Nuovo intervento</button></div><div class="section">Riepilogo</div><div class="grid" id="metrics"></div><div class="section">Andamento guadagni</div><div class="chart" id="chart"></div><div class="section">Ultimi interventi</div><div id="homeRecent" class="list"></div>`;restoreHomeFilters();['fy','fm','fclient','fstatus','fpayment'].forEach(id=>{let el=document.getElementById(id);if(el)el.onchange=()=>{saveHomeFilters();updateDash()}});let remember=document.getElementById('rememberFilters');if(remember)remember.onchange=()=>{saveHomeFilters();updateDash()};updateDash();renderHomeRecent()}
function showToCollect(){let js=db.jobs.filter(j=>jobToCollect(j)>0).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((Number(b.num)||0)-(Number(a.num)||0)));let body=js.map(j=>`<div class="item" onclick="openJob('${j.id}')"><div class="row"><div><b>${esc(clientName(j.clientId))}</b><div class="muted">Lavoro #${esc(j.num)} · ${esc(j.date||'')} · ${paymentStatus(j)}</div></div><div style="text-align:right"><div class="amount" style="color:#dc2626">${euro(jobToCollect(j))}</div><div class="muted">da incassare</div></div></div></div>`).join('');modal(`<h2>💳 Da incassare</h2><div class="muted" style="margin-bottom:12px">Lavori non pagati o parzialmente pagati${js.length?' · '+js.length+' lavoro'+(js.length===1?'':'i'):''}.</div><div class="list">${body||'<div class="empty">Nessun lavoro da incassare.</div>'}</div><div class="actions"><button class="primary" onclick="closeModal()">Chiudi</button></div>`)}
function getPeriodJobs(){let y=document.getElementById('fy')?.value||'all',m=document.getElementById('fm')?.value||'all',c=document.getElementById('fclient')?.value||'all',st=document.getElementById('fstatus')?.value||'all',ps=document.getElementById('fpayment')?.value||'all';return db.jobs.filter(j=>{let d=new Date((j.date||'')+'T00:00:00');let clientOk=c==='all'||(c.startsWith('c:')?j.clientId===c.slice(2):c.startsWith('s:')?db.interventions.some(i=>i.jobId===j.id&&i.subclientId===c.slice(2)):false);let statusOk=st==='all'||(j.status||'Aperto')===st;let due=jobToCollect(j);let pay=jobPayments(j);let payOk=ps==='all'||(ps==='paid'?due<=0:(ps==='partial'?pay>0&&due>0:(ps==='unpaid'?pay<=0&&due>0:false)));return (y==='all'||d.getFullYear()==y)&&(m==='all'||d.getMonth()+1==m)&&clientOk&&statusOk&&payOk})}
function updateDash(){
  let js=getPeriodJobs();
  let filter=document.getElementById('fclient')?.value||'all';
  let subMode=filter.startsWith('s:'), clientMode=filter.startsWith('c:'), selectedId=(subMode||clientMode)?filter.slice(2):'';
  let selectedJobs=clientMode ? js.filter(j=>j.clientId===selectedId) : js;
  let selectedInts=subMode
    ? db.interventions.filter(i=>i.subclientId===selectedId && selectedJobs.some(j=>j.id===i.jobId))
    : db.interventions.filter(i=>selectedJobs.some(j=>j.id===i.jobId));
  let tot,sp,tax,gain,invGain,noinvGain,payments,toCollect;
  if(subMode){
    // Il sottocliente deve filtrare SOLO gli importi degli interventi.
    tot=selectedInts.reduce((a,i)=>a+(Number(i.cost)||0),0);
    sp=selectedInts.reduce((a,i)=>a+db.expenses.filter(e=>e.intId===i.id).reduce((x,e)=>x+(Number(e.amount)||0),0),0);
    tax=selectedInts.reduce((a,i)=>{let j=db.jobs.find(x=>x.id===i.jobId);return a+(Number(j?.taxRate)||0)*(Number(i.cost)||0)/100},0);
    gain=tot-sp-tax;
    // I pagamenti sono registrati a livello di lavoro, quindi non sono attribuibili
    // automaticamente a un singolo sottocliente.
    payments=null; toCollect=null; invGain=null; noinvGain=null;
  }else{
    // Il cliente deve filtrare l'importo complessivo dei lavori.
    tot=selectedJobs.reduce((a,j)=>a+jobTotal(j),0);
    sp=selectedJobs.reduce((a,j)=>a+jobExpenses(j),0);
    tax=selectedJobs.reduce((a,j)=>a+jobTax(j),0);
    gain=tot-sp-tax;
    payments=js.reduce((a,j)=>a+jobPayments(j),0);
    toCollect=tot-payments;
    invGain=js.filter(j=>j.invoice===true).reduce((a,j)=>a+jobProfit(j),0);
    noinvGain=js.filter(j=>j.invoice!==true).reduce((a,j)=>a+jobProfit(j),0);
  }
  let payHtml=payments===null?'—':euro(payments), dueHtml=toCollect===null?'—':euro(toCollect), invHtml=invGain===null?'—':euro(invGain), noinvHtml=noinvGain===null?'—':euro(noinvGain);
  document.getElementById('metrics').innerHTML=`
    <div class="card metric"><small>💰 ${subMode?'Importo interventi':'Fatturato lavori'}</small><div class="n">${euro(tot)}</div></div>
    <div class="card metric"><small>💰 Guadagno</small><div class="n">${euro(gain)}</div></div>
    <div class="card metric"><small>💸 Spese</small><div class="n">${euro(sp)}</div></div>
    <div class="card metric"><small>🏦 Accantonamento tasse</small><div class="n">${euro(tax)}</div></div>
    <div class="card metric"><small>💳 Da incassare</small><div class="n">${dueHtml}</div></div>
    <div class="card metric"><small>🧾 Guadagno fattura</small><div class="n">${invHtml}</div></div>
    <div class="card metric"><small>💶 Guadagno senza fattura</small><div class="n">${noinvHtml}</div></div>
    <div class="card metric"><small>📁 Lavori</small><div class="n">${js.length}</div></div>
    <div class="card metric"><small>🔧 Interventi</small><div class="n">${subMode?selectedInts.length:db.interventions.filter(i=>js.some(j=>j.id===i.jobId)).length}</div></div>`;
  let months=Array.from({length:12},(_,i)=>({m:i+1,v:0}));
  let y=document.getElementById('fy').value,mf=document.getElementById('fm')?.value||'all',c=document.getElementById('fclient')?.value||'all',st=document.getElementById('fstatus')?.value||'all',ps=document.getElementById('fpayment')?.value||'all';
  let chartJobs=db.jobs.filter(j=>{let d=new Date((j.date||'')+'T00:00:00');let clientOk=c==='all'||(c.startsWith('c:')?j.clientId===c.slice(2):c.startsWith('s:')?db.interventions.some(i=>i.jobId===j.id&&i.subclientId===c.slice(2)):false);let statusOk=st==='all'||(j.status||'Aperto')===st;let due=jobToCollect(j),pay=jobPayments(j);let payOk=ps==='all'||(ps==='paid'?due<=0:(ps==='partial'?pay>0&&due>0:(ps==='unpaid'?pay<=0&&due>0:false)));return (y==='all'||d.getFullYear()==y)&&(mf==='all'||d.getMonth()+1==mf)&&clientOk&&statusOk&&payOk});

function cp1252Bytes(str){const map={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};let a=[];for(const ch of String(str)){const c=ch.charCodeAt(0);a.push(map[ch]??(c<=255?c:63));}return new Uint8Array(a)}
function asciiBytes(str){return new TextEncoder().encode(str)}
function concatBytes(parts){let n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n),i=0;for(const p of parts){o.set(p,i);i+=p.length}return o}
function pdfEscape(str){return String(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function wrapPdfLine(str,max=88){let s=String(str??'').replace(/\s+/g,' ').trim();if(!s)return [''];let out=[];while(s.length>max){let cut=s.lastIndexOf(' ',max);if(cut<30)cut=max;out.push(s.slice(0,cut));s=s.slice(cut).trim()}if(s)out.push(s);return out}
function pdfColor(r,g,b){return `${r} ${g} ${b}`}
function pdfColor(r,g,b){return `${r} ${g} ${b}`}
function buildPdf(title,lines,imgBytes,imgW=853,imgH=178){
  const W=595,H=842,margin=42,contentW=W-margin*2,top=775,bottom=52;
  const blue=pdfColor(.08,.31,.55),light=pdfColor(.93,.96,.99),dark=pdfColor(.12,.15,.18),muted=pdfColor(.35,.40,.46);
  const pages=[];let page={items:[]};let y=top;
  function newPage(){if(page.items.length)pages.push(page);page={items:[]};y=top;}
  function need(h=18){if(y-h<bottom)newPage()}
  function rect(x,yy,w,h,fill){page.items.push({type:'rect',x,y:yy,w,h,fill})}
  function line(x1,y1,x2,y2,c=muted){page.items.push({type:'line',x1,y1,x2,y2,c})}
  function text(t,x,yy,size=10,bold=false,c=dark){page.items.push({type:'text',text:String(t),x,y:yy,size,bold,c})}
  function addWrapped(t,size=10,bold=false,x=margin,max=86,c=dark){for(const ln of wrapPdfLine(t,max)){need(size+7);text(ln,x,y,size,bold,c);y-=size+6}}
  function section(t){need(30);y-=5;rect(margin,y-4,contentW,22,light);text(t.toUpperCase(),margin+9,y+3,10,true,blue);y-=28}
  function keyValue(label,value){need(24);text(label,margin+9,y,9,true,muted);text(String(value||'—'),margin+125,y,10,false,dark);y-=17}

  if(imgBytes){need(70);page.items.push({type:'image',x:margin,y:755,w:245,h:51})}
  text('DG SERVIZI TECNOLOGICI',350,764,9,true,blue)
  text('di Davide Geraci',350,749,8,false,muted)
  line(margin,735,W-margin,735,blue);y=712
  addWrapped(title,19,true,margin,52,blue);y-=4

  for(const raw of lines){const lineText=String(raw??'')
    if(lineText===''){y-=7;continue}
    if(lineText.startsWith('## ')){section(lineText.slice(3));continue}
    if(lineText.startsWith('### ')){need(30);addWrapped(lineText.slice(4),11,true,margin,78,blue);line(margin,y+1,W-margin,y+1,light);y-=8;continue}
    if(/^[-•] /.test(lineText)){addWrapped('• '+lineText.replace(/^[-•] /,''),9.5,false,margin+8,80,dark);continue}
    const kv=lineText.match(/^([^:]{1,35}):\s*(.*)$/)
    if(kv && !lineText.startsWith('Categoria:') && !lineText.startsWith('Tempo:') && !lineText.startsWith('Richiesta:') && !lineText.startsWith('Lavoro svolto:') && !lineText.startsWith('Spese:')){keyValue(kv[1],kv[2]);continue}
    addWrapped(lineText,9.5,false,margin+2,82,dark)
  }
  if(page.items.length)pages.push(page)

  const objs=[];const put=b=>{objs.push(b);return objs.length}
  put(asciiBytes('<< /Type /Catalog /Pages 2 0 R >>'))
  put(null)
  put(asciiBytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'))
  put(asciiBytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'))
  let imgObj=0
  if(imgBytes){imgObj=put(concatBytes([asciiBytes(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`),imgBytes,asciiBytes('\nendstream')]))}
  const pageRefs=[]
  pages.forEach((pg,idx)=>{
    const cp=[]
    if(imgObj){const im=pg.items.find(x=>x.type==='image');if(im)cp.push(asciiBytes(`q ${im.w} 0 0 ${im.h} ${im.x} ${im.y} cm /Im1 Do Q\n`))}
    for(const it of pg.items){
      if(it.type==='image')continue
      if(it.type==='rect'){cp.push(asciiBytes(`${it.fill} rg ${it.x} ${it.y} ${it.w} ${it.h} re f\n`));continue}
      if(it.type==='line'){cp.push(asciiBytes(`${it.c} RG 0.7 w ${it.x1} ${it.y1} m ${it.x2} ${it.y2} l S\n`));continue}
      const font=it.bold?4:3
      cp.push(cp1252Bytes(`BT /F${font} ${it.size} Tf ${it.c} rg ${it.x} ${it.y} Td (${pdfEscape(it.text)}) Tj ET\n`))
    }
    cp.push(asciiBytes(`${muted} RG 0.5 w ${margin} 39 m ${W-margin} 39 l S\n`))
    cp.push(asciiBytes(`BT /F1 8 Tf ${muted} rg ${margin} 26 Td (DG Servizi Tecnologici - Documento generato dal gestionale) Tj ET\n`))
    cp.push(asciiBytes(`BT /F1 8 Tf ${muted} rg ${W-87} 26 Td (Pagina ${idx+1} di ${pages.length}) Tj ET\n`))
    const stream=concatBytes(cp)
    const c=put(concatBytes([asciiBytes(`<< /Length ${stream.length} >>\nstream\n`),stream,asciiBytes('\nendstream')]))
    let res=`<< /Font << /F1 3 0 R /F2 4 0 R >>`
    if(imgObj)res+=` /XObject << /Im1 ${imgObj} 0 R >>`
    res+=' >>'
    const pr=put(asciiBytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources ${res} /Contents ${c} 0 R >>`))
    pageRefs.push(pr)
  })
  objs[1]=asciiBytes(`<< /Type /Pages /Kids [${pageRefs.map(n=>n+' 0 R').join(' ')}] /Count ${pageRefs.length} >>`)
  const header=asciiBytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'),chunks=[header],offsets=[0];let pos=header.length
  for(let i=0;i<objs.length;i++){const pre=asciiBytes(`${i+1} 0 obj\n`),body=objs[i],post=asciiBytes('\nendobj\n');offsets.push(pos);chunks.push(pre,body,post);pos+=pre.length+body.length+post.length}
  const xrefPos=pos
  let xref=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`
  for(let i=1;i<=objs.length;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n'
  xref+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`
  chunks.push(asciiBytes(xref));return concatBytes(chunks)
}

async function downloadPDF(title,lines){let img=await fetchLogoBytes();let bytes=buildPdf(title,lines,img);let blob=new Blob([bytes],{type:'application/pdf'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=(title||'documento').replace(/[^a-z0-9àèéìòù _-]/gi,'').replace(/\s+/g,'-')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function exportJobPDF(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;let ints=db.interventions.filter(i=>i.jobId===id).sort((a,b)=>b.date.localeCompare(a.date)||((Number(b.num)||0)-(Number(a.num)||0)));let lines=[`Cliente: ${clientName(j.clientId)}`,`Data lavoro: ${j.date}`,`Fattura: ${j.invoice?'Sì':'No'}`];if(j.invoice){lines.push(`Fattura n°: ${j.invoiceNo||'—'}`,`Data fattura: ${j.invoiceDate||'—'}`,`Accantonamento: ${Number(j.taxRate)||0}%`)}lines.push('','## Interventi');for(const i of ints){let s=db.clients.find(c=>c.id===i.subclientId)||{},ex=db.expenses.filter(e=>e.intId===i.id);lines.push(`### ${i.date} · ${s.name||'Nessun sottocliente'} · ${s.city||''}${s.city&&s.street?' · ':''}${s.street||''}`,`Categoria: ${catName(i.catId)} · Importo: ${euro(i.cost)}`,`Tempo: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'—'}`,`Richiesta: ${i.request||'—'}`,`Lavoro svolto: ${i.work||'—'}`);if(i.attachment?.name)lines.push(`Allegato: ${i.attachment.name}`);if(ex.length){lines.push('Spese:');for(const e of ex)lines.push(`- ${e.desc}: ${euro(e.amount)}`)}lines.push('')}lines.push('## Riepilogo',`Totale interventi: ${euro(jobTotal(j))}`,`Totale spese: ${euro(jobExpenses(j))}`,`Accantonamento tasse: ${euro(jobTax(j))}`,`Guadagno: ${euro(jobProfit(j))}`,`Pagamenti ricevuti: ${euro(jobPayments(j))}`,`Da incassare: ${euro(jobToCollect(j))}`);await downloadPDF(`Lavoro-${clientName(j.clientId)}`,lines)}
async function exportIntPDF(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let j=db.jobs.find(x=>x.id===i.jobId)||{},s=db.clients.find(c=>c.id===i.subclientId)||{},es=db.expenses.filter(e=>e.intId===id);let lines=[`Cliente: ${clientName(j.clientId)}`,`Data: ${i.date}`,`Sottocliente: ${s.name||'Nessuno'}`,`Città/Via: ${s.city||''}${s.city&&s.street?' · ':''}${s.street||''}`,`Categoria: ${catName(i.catId)}`,`Importo: ${euro(i.cost)}`,`Ora: ${i.start||'—'} - ${i.end||'—'}`,`Tempo lavorato: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'—'}`,'','## Richiesta cliente',i.request||'—','','## Lavoro svolto',i.work||'—','','## Spese'];for(const e of es)lines.push(`- ${e.desc}: ${euro(e.amount)}`);if(!es.length)lines.push('Nessuna spesa');if(i.attachment?.name)lines.push('','Allegato: '+i.attachment.name);await downloadPDF(`Intervento-${i.num}-${clientName(j.clientId)}`,lines)}
function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-gestionale.json';a.click()}
function importDB(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.interventions)||!Array.isArray(x.clients)){throw new Error('struttura')}db={clients:x.clients||[],cats:x.cats||[],jobs:x.jobs||[],interventions:x.interventions||[],expenses:x.expenses||[],payments:x.payments||[],seqJob:x.seqJob||0,seqInt:x.seqInt||0};save();render();alert('Backup importato correttamente.')}catch(_){alert('Backup non valido o danneggiato.')}};r.readAsText(f)}
document.addEventListener('DOMContentLoaded',()=>{const tabs=document.querySelectorAll('.tabs button');tabs.forEach(b=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));const search=document.getElementById('globalSearch');if(search)search.addEventListener('input',()=>{if(search.value.trim())searchResults();else render()});const fab=document.getElementById('fab');if(fab){fab.onclick=null;fab.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();newJob();});}document.addEventListener('click',function(ev){const b=ev.target.closest&&ev.target.closest('#newJobBtn');if(b){ev.preventDefault();newJob();}});const modalEl=document.getElementById('modal');if(modalEl)modalEl.addEventListener('click',e=>{if(e.target===modalEl)closeModal()});render();});
