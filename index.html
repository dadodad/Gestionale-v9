<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Interventi"><link rel="manifest" href="manifest.json"><title>Gestione Interventi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:600}header{position:sticky;top:0;z-index:10;background:#111827;color:white;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));box-shadow:0 2px 8px #0002}.brand{font-size:20px;font-weight:800}.search{margin-top:10px;width:100%;padding:12px 14px;border-radius:12px;border:0;background:#fff;color:#111}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.tabs button{background:none;padding:8px 6px;font-size:12px;color:#667}.tabs .active{color:#111827;font-weight:800}.main{padding:16px 16px 100px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:white;border-radius:16px;padding:14px;box-shadow:0 1px 5px #00000012}.metric .n{font-size:24px;font-weight:800;margin-top:5px}.metric small{color:#6b7280}.primary{background:#111827;color:white;width:100%}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.section{margin:18px 0 10px;font-size:17px;font-weight:800}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:14px;padding:14px;border:1px solid #e5e7eb}.muted{color:#6b7280;font-size:13px}.amount{font-weight:800}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#f8fafc;width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#4b5563;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}.field textarea{min-height:90px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.chart{height:220px;background:white;border-radius:16px;padding:10px}.barwrap{height:180px;display:flex;align-items:end;gap:7px;padding:10px 4px}.bar{flex:1;min-width:10px;background:#111827;border-radius:5px 5px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#6b7280}.empty{padding:28px;text-align:center;color:#6b7280}.fab{position:fixed;right:18px;bottom:76px;z-index:25;width:58px;height:58px;border-radius:50%;background:#111827;color:#fff;font-size:28px;box-shadow:0 5px 18px #0004}.hidden{display:none!important}.dashboard-logo{background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:16px;box-shadow:0 1px 5px #00000012;display:flex;justify-content:center;align-items:center}.dashboard-logo img{display:block;width:100%;max-width:620px;height:auto;max-height:120px;object-fit:contain}.dashboard-head{background:#fff;border-radius:16px;padding:16px;margin-bottom:4px;box-shadow:0 1px 5px #00000012}.dashboard-title{font-size:22px;font-weight:800}.fixed-job{border-left:4px solid #111827}.print-only{display:none}
@media print{body.printing>*:not(#printArea){display:none!important}body.printing #printArea{display:block!important;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}body.printing #printArea h1{font-size:24px;margin:0 0 8px}body.printing #printArea h2{font-size:18px;margin:20px 0 8px}body.printing #printArea .print-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #ddd;padding:6px 0}body.printing #printArea .print-total{font-weight:800}body.printing #printArea img{max-width:360px;max-height:100px;object-fit:contain;margin-bottom:16px}}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{max-width:650px;border-radius:20px}.filters{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><div class="brand">Gestione Interventi</div><input id="globalSearch" class="search" placeholder="🔎 Cerca interventi, clienti, sottoclienti..."></header>
<main class="main" id="app"></main>
<button class="fab" id="fab" type="button" aria-label="Nuovo lavoro">＋</button>
<nav class="tabs"><button data-tab="home" class="active">🏠<br>Home</button><button data-tab="jobs">📁<br>Lavori</button><button data-tab="anagrafica">👥<br>Anagrafica</button><button data-tab="more">⚙️<br>Altro</button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div id="printArea" class="print-only"></div>
<script>
const KEY='gestionale_interventi_v2';
const uid=()=>('id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9));
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{clients:[],cats:[],jobs:[],interventions:[],expenses:[],payments:[],seqJob:0,seqInt:0};db.jobs.forEach(j=>{if(typeof j.invoice!=='boolean')j.invoice=false;if(typeof j.invoiceNo!=='string')j.invoiceNo='';if(typeof j.invoiceDate!=='string')j.invoiceDate='';if(typeof j.taxRate!=='number')j.taxRate=0;if(typeof j.fixed!=='boolean')j.fixed=false;if(typeof j.status!=='string')j.status='Aperto'});save();
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const euro=n=>(Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function yearFilter(){let y=new Date().getFullYear();return `<select id="fy"><option value="all">Tutti gli anni</option>${[y-2,y-1,y,y+1].map(x=>`<option>${x}</option>`).join('')}</select>`}
function monthFilter(){return `<select id="fm"><option value="all">Tutti i mesi</option>${['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'].map((x,i)=>`<option value="${i+1}">${x}</option>`).join('')}</select>`}
function jobTotal(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+(Number(i.cost)||0),0)}
function jobExpenses(j){return db.interventions.filter(i=>i.jobId===j.id).reduce((s,i)=>s+db.expenses.filter(e=>e.intId===i.id).reduce((a,e)=>a+(Number(e.amount)||0),0),0)}
function jobTax(j){return jobTotal(j)*(Number(j.taxRate)||0)/100}
function jobProfit(j){return jobTotal(j)-jobExpenses(j)-jobTax(j)}
function jobPayments(j){return db.payments.filter(p=>p.jobId===j.id).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function jobToCollect(j){return jobTotal(j)-jobPayments(j)}
function paymentStatus(j){let due=jobToCollect(j);return due<=0?'🟢 Pagato':jobPayments(j)>0?'🟠 Parzialmente pagato':'🔴 Da incassare'}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'—'}
function catName(id){let c=db.cats.find(c=>c.id===id);return c?c.desc:'—'}
function render(){let tab=document.querySelector('.tabs .active')?.dataset.tab||'home'; if(tab==='home')home();else if(tab==='jobs')jobs();else if(tab==='anagrafica')anagrafica();else more()}
function filteredInterventions(){let q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();let arr=db.interventions.filter(i=>{let j=db.jobs.find(x=>x.id===i.jobId)||{};let c=db.clients.find(x=>x.id===j.clientId)||{};let sub=db.clients.find(x=>x.id===i.subclientId)||{};let cat=db.cats.find(x=>x.id===i.catId)||{};let exps=db.expenses.filter(e=>e.intId===i.id);let pays=db.payments.filter(p=>p.jobId===i.jobId);let hay=[i.num,i.date,i.start,i.end,i.request,i.work,i.minutes,i.attachment?.name||'',j.num,j.date,j.invoice?'fattura':'no fattura',c.name,c.city,c.street,c.fraz,c.branch,c.close,sub.name,sub.city,sub.street,sub.fraz,sub.branch,sub.close,cat.code,cat.desc,...exps.flatMap(e=>[e.desc,e.amount]),...pays.flatMap(x=>[x.date,x.amount,x.method,x.note])].join(' ').toLowerCase();return !q||hay.includes(q)});return arr.sort((a,b)=>{let d=(b.date||'').localeCompare(a.date||'');return d||((Number(b.num)||0)-(Number(a.num)||0))})}
function interventionCard(i){let j=db.jobs.find(x=>x.id===i.jobId)||{};let sub=db.clients.find(c=>c.id===i.subclientId)||{};let hasAttachment=!!i.attachment?.data;return `<div class="item" onclick="editInt('${i.id}')"><div class="row"><div><b>${esc(sub.name||'Nessun sottocliente')}</b><div class="muted">${esc(sub.city||'')} ${sub.city&&sub.street?'· ':''}${esc(sub.street||'')}</div></div><span class="amount">${euro(i.cost)}</span></div><div class="row" style="margin-top:8px"><span class="muted">${esc(i.date||'')} · ${esc(clientName(j.clientId))}</span><span>${hasAttachment?'📎':''}</span></div><div class="muted">${esc(catName(i.catId))}${i.request?' · '+esc(i.request):''}</div></div>`}
function searchResults(){let arr=filteredInterventions();document.getElementById('app').innerHTML=`<div class="section">Interventi trovati (${arr.length})</div><div class="list">${arr.map(interventionCard).join('')||'<div class="empty">Nessun intervento trovato.</div>'}</div>`}
function clientFilter(){return `<select id="fclient"><option value="all">Tutti i clienti</option>${db.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'it')).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>`}
function home(){let app=document.getElementById('app');app.innerHTML=`<div class="dashboard-logo"><img src="logo.jpeg" alt="DG Servizi Tecnologici di Davide Geraci"></div><div class="section">Filtra riepilogo</div><div class="filters">${yearFilter()}${monthFilter()}</div><div class="field"><label>Cliente</label>${clientFilter()}</div><div class="section">Riepilogo</div><div class="grid" id="metrics"></div><div class="section">Andamento guadagni</div><div class="chart" id="chart"></div>`;document.getElementById('fy').onchange=updateDash;document.getElementById('fm').onchange=updateDash;document.getElementById('fclient').onchange=updateDash;updateDash()}
function getPeriodJobs(){let y=document.getElementById('fy')?.value||'all',m=document.getElementById('fm')?.value||'all',c=document.getElementById('fclient')?.value||'all';return db.jobs.filter(j=>{let d=new Date(j.date+'T00:00:00');return (y==='all'||d.getFullYear()==y)&&(m==='all'||d.getMonth()+1==m)&&(c==='all'||j.clientId===c)})}
function updateDash(){let js=getPeriodJobs(),tot=js.reduce((a,j)=>a+jobTotal(j),0),sp=js.reduce((a,j)=>a+jobExpenses(j),0),payments=js.reduce((a,j)=>a+jobPayments(j),0),toCollect=tot-payments,tax=js.reduce((a,j)=>a+jobTax(j),0),gain=tot-sp-tax,inv=js.filter(j=>j.invoice===true),noinv=js.filter(j=>j.invoice!==true),invGain=inv.reduce((a,j)=>a+jobProfit(j),0),noinvGain=noinv.reduce((a,j)=>a+jobProfit(j),0);document.getElementById('metrics').innerHTML=`<div class="card metric"><small>💰 Fatturato interventi</small><div class="n">${euro(tot)}</div></div><div class="card metric"><small>💰 Guadagno</small><div class="n">${euro(gain)}</div></div><div class="card metric"><small>💸 Spese</small><div class="n">${euro(sp)}</div></div><div class="card metric"><small>🏦 Accantonamento tasse</small><div class="n">${euro(tax)}</div></div><div class="card metric"><small>💳 Da incassare</small><div class="n">${euro(toCollect)}</div></div><div class="card metric"><small>🧾 Guadagno fattura</small><div class="n">${euro(invGain)}</div></div><div class="card metric"><small>💶 Guadagno senza fattura</small><div class="n">${euro(noinvGain)}</div></div><div class="card metric"><small>📁 Lavori</small><div class="n">${js.length}</div></div><div class="card metric"><small>🔧 Interventi</small><div class="n">${db.interventions.filter(i=>js.some(j=>j.id===i.jobId)).length}</div></div>`;let months=Array.from({length:12},(_,i)=>({m:i+1,v:0}));let y=document.getElementById('fy').value,c=document.getElementById('fclient')?.value||'all';let chartJobs=db.jobs.filter(j=>{let d=new Date(j.date+'T00:00:00');return (y==='all'||d.getFullYear()==y)&&(c==='all'||j.clientId===c)});chartJobs.forEach(j=>{let m=new Date(j.date+'T00:00:00').getMonth();months[m].v+=jobProfit(j)});let max=Math.max(1,...months.map(x=>x.v));document.getElementById('chart').innerHTML=`<div class="barwrap">${months.map((x,i)=>`<div class="bar" style="height:${Math.max(3,x.v/max*150)}px" title="${euro(x.v)}"><span>${['G','F','M','A','M','G','L','A','S','O','N','D'][i]}</span></div>`).join('')}</div>`}
function jobCard(j,fixed=false){return `<div class="item ${fixed?'fixed-job':''}" onclick="openJob('${j.id}')"><div class="row"><b>${j.fixed?'📌 ':''}${esc(clientName(j.clientId))}</b><span class="amount">${euro(jobProfit(j))}</span></div><div class="muted">${esc(j.date)} · ${db.interventions.filter(i=>i.jobId===j.id).length} interventi · spese ${euro(jobExpenses(j))} · ${j.invoice?'🧾 Fattura':'💶 No fattura'} · ${esc(j.status||'Aperto')}</div><div class="muted">${j.invoice&&j.invoiceNo?'Fattura n° '+esc(j.invoiceNo)+' · ':''}${j.invoice&&j.invoiceDate?'Data fattura '+esc(j.invoiceDate)+' · ':''}Tasse ${euro(jobTax(j))} · Da incassare ${euro(jobToCollect(j))} · ${paymentStatus(j)}</div></div>`}
function filteredJobs(){let y=document.getElementById('fy')?.value||'all',m=document.getElementById('fm')?.value||'all';return db.jobs.filter(j=>{let d=new Date((j.date||'')+'T00:00:00');return (y==='all'||d.getFullYear()==y)&&(m==='all'||d.getMonth()+1==m)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((Number(b.num)||0)-(Number(a.num)||0)))}
function jobs(){let arr=filteredJobs(),fixed=db.jobs.filter(j=>j.fixed).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||((Number(b.num)||0)-(Number(a.num)||0)));document.getElementById('app').innerHTML=`<div class="row"><div class="section">Lavori</div><button class="primary" id="newJobBtn" type="button">＋ Nuovo lavoro</button></div><div class="section">📌 Lavori fissati</div><div class="list">${fixed.map(j=>jobCard(j,true)).join('')||'<div class="empty">Nessun lavoro fissato.</div>'}</div><div class="section">Tutti i lavori</div><div class="section">Filtra lavori per periodo</div><div class="filters">${yearFilter()}${monthFilter()}</div><div class="list" style="margin-top:12px">${arr.map(jobCard).join('')||'<div class="empty">Nessun lavoro trovato.</div>'}</div>`;document.getElementById('fy').onchange=jobs;document.getElementById('fm').onchange=jobs}
function anagrafica(section='clients'){document.getElementById('app').innerHTML=`<div class="section">Anagrafica</div><div class="row"><button class="${section==='clients'?'primary':'secondary'}" onclick="anagrafica('clients')">👥 Clienti</button><button class="${section==='cats'?'primary':'secondary'}" onclick="anagrafica('cats')">🏷️ Categorie</button></div><div style="margin-top:16px"></div>${section==='clients'?clientsContent():categoriesContent()}`}
function clients(){anagrafica('clients')}
function clientsContent(){return `<div class="row"><div class="section">Clienti</div><button class="primary" onclick="newClient()">＋ Cliente</button></div><div class="list">${db.clients.map(c=>`<div class="item"><b>${esc(c.name)}</b><div class="muted">${esc(c.city)} · ${esc(c.street)} · ${esc(c.branch||'')}</div><div class="muted">Frazionario: ${esc(c.fraz)} · Chiusura: ${esc(c.close||'')}</div><div class="actions"><button class="secondary" onclick="editClient('${c.id}')">✏️ Modifica</button><button class="danger" onclick="deleteClient('${c.id}')">🗑️ Elimina</button></div></div>`).join('')||'<div class="empty">Inserisci il primo cliente.</div>'}</div>`}
function categoriesContent(){return `<div class="section">Categorie intervento</div><div class="card"><button class="primary" onclick="newCat()">＋ Nuova categoria</button></div><div class="list">${db.cats.map(c=>`<div class="item"><div class="row"><b>${esc(c.code)}</b><span class="amount">${euro(c.amount)}</span></div><div>${esc(c.desc)}</div><div class="actions"><button class="secondary" onclick="editCat('${c.id}')">✏️ Modifica</button><button class="danger" onclick="deleteCat('${c.id}')">🗑️ Elimina</button></div></div>`).join('')||'<div class="empty">Nessuna categoria.</div>'}</div>`}
function editClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;modal(`<h2>Modifica cliente</h2>${[['cn','Nome',c.name],['city','Città',c.city],['street','Via',c.street],['fraz','Frazionario',c.fraz],['branch','Numero filiale',c.branch],['close','Orario chiusura',c.close]].map(x=>`<div class="field"><label>${x[1]}</label><input id="${x[0]}" value="${esc(x[2]||'')}"></div>`).join('')}<div class="actions"><button class="secondary" onclick="closeModal();clients()">Annulla</button><button class="primary" onclick="saveEditClient('${id}')">Salva</button></div>`)}
function saveEditClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;['cn','city','street','fraz','branch','close'].forEach((k,idx)=>{let v=document.getElementById(k)?.value||'';c[['name','city','street','fraz','branch','close'][idx]]=v});save();closeModal();clients()}
function deleteClient(id){let c=db.clients.find(x=>x.id===id);if(!c)return;if(db.jobs.some(j=>j.clientId===id)||db.interventions.some(i=>i.subclientId===id)){alert('Questo cliente è utilizzato da lavori o interventi e non può essere eliminato. Puoi modificarlo.');return}if(confirm(`Eliminare il cliente "${c.name}"?`)){db.clients=db.clients.filter(x=>x.id!==id);save();clients()}}
function more(){document.getElementById('app').innerHTML=`<div class="section">Backup</div><div class="card"><button class="primary" onclick="exportDB()">📤 Esporta backup JSON</button><div class="field"><label>Ripristina backup</label><input id="backupFile" type="file" accept="application/json,.json" onchange="importDB(event)"></div><div class="muted">Il backup contiene lavori, interventi, spese, pagamenti, clienti, categorie e allegati.</div></div>`}
function editCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;modal(`<h2>Modifica categoria</h2><div class="field"><label>Codice categoria</label><input id="ccode" value="${esc(c.code)}"></div><div class="field"><label>Descrizione</label><input id="cdesc" value="${esc(c.desc)}"></div><div class="field"><label>Importo</label><input id="camount" type="number" step="0.01" inputmode="decimal" value="${Number(c.amount)||0}"></div><div class="actions"><button class="secondary" onclick="closeModal();more()">Annulla</button><button class="primary" onclick="saveEditCat('${id}')">Salva</button></div>`)}
function saveEditCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;c.code=document.getElementById('ccode')?.value||'';c.desc=document.getElementById('cdesc')?.value||'';c.amount=Number(document.getElementById('camount')?.value)||0;save();closeModal();anagrafica('cats')}
function deleteCat(id){let c=db.cats.find(x=>x.id===id);if(!c)return;if(db.interventions.some(i=>i.catId===id)){alert('Questa categoria è utilizzata da uno o più interventi e non può essere eliminata. Puoi modificarla.');return}if(confirm(`Eliminare la categoria "${c.desc}"?`)){db.cats=db.cats.filter(x=>x.id!==id);save();anagrafica('cats')}}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')};
function toggleInvoiceFields(prefix){let cb=document.getElementById(prefix+'inv'),box=document.getElementById(prefix+'invoiceFields');if(box)box.classList.toggle('hidden',!cb?.checked)}
function newJob(){let next=db.seqJob+1;if(!db.clients.length){modal(`<h2>Nuovo lavoro</h2><div class="card">Prima di creare un lavoro devi inserire almeno un cliente.</div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Annulla</button><button type="button" class="primary" onclick="newClient()">＋ Inserisci cliente</button></div>`);return}modal(`<h2>Nuovo lavoro</h2><div class="field"><label>Cliente</label><select id="jc">${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="jd" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Fattura</label><div class="row"><span class="muted">Il lavoro è fatturato?</span><input id="jinv" type="checkbox" onchange="toggleInvoiceFields('j')" style="width:24px;height:24px;flex:0 0 auto"></div></div><div id="jinvoiceFields" class="hidden"><div class="field"><label>Fattura n°</label><input id="jinvno"></div><div class="field"><label>Data fattura</label><input id="jinvdate" type="date"></div><div class="field"><label>% accantonamento tasse</label><input id="jtax" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="0"></div></div><div class="field"><label>Stato lavoro</label><select id="jstatus"><option>Aperto</option><option>In corso</option><option>Completato</option><option>Chiuso</option><option>Annullato</option></select></div><div class="field"><label>Fissa lavoro</label><div class="row"><span class="muted">Mostra il lavoro nella dashboard</span><input id="jfixed" type="checkbox" style="width:24px;height:24px;flex:0 0 auto"></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Annulla</button><button class="primary" onclick="saveJob(${next})">Crea lavoro</button></div>`)}
function saveJob(num){const clientEl=document.getElementById('jc'),dateEl=document.getElementById('jd'),inv=!!document.getElementById('jinv')?.checked;if(!clientEl||!dateEl||!clientEl.value||!dateEl.value){alert('Seleziona il cliente e la data.');return}db.seqJob=num;db.jobs.push({id:uid(),num,date:dateEl.value,clientId:clientEl.value,invoice:inv,invoiceNo:inv?(document.getElementById('jinvno')?.value||''):'',invoiceDate:inv?(document.getElementById('jinvdate')?.value||''):'',taxRate:inv?(Number(document.getElementById('jtax')?.value)||0):0,fixed:!!document.getElementById('jfixed')?.checked,status:document.getElementById('jstatus')?.value||'Aperto'});save();closeModal();render()}
function openJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;let ints=db.interventions.filter(x=>x.jobId===id).sort((a,b)=>{let d=(b.date||'').localeCompare(a.date||'');return d||((Number(b.num)||0)-(Number(a.num)||0))});modal(`<h2>${esc(clientName(j.clientId))}</h2><div class="card"><b>${esc(clientName(j.clientId))}</b><div class="muted">${esc(j.date)} · ${esc(j.status||'Aperto')} · ${j.invoice?'🧾 Fattura':'💶 No fattura'}${j.fixed?' · 📌 Fissa':''}</div>${j.invoice?`<div class="muted">Fattura n° ${esc(j.invoiceNo||'—')} · Data ${esc(j.invoiceDate||'—')} · Accantonamento ${Number(j.taxRate)||0}%</div>`:''}<div class="section">Totali</div><div class="grid"><div><span class="muted">Interventi</span><br><b>${euro(jobTotal(j))}</b></div><div><span class="muted">Spese</span><br><b>${euro(jobExpenses(j))}</b></div><div><span class="muted">Accantonamento tasse</span><br><b>${euro(jobTax(j))}</b></div><div><span class="muted">Guadagno</span><br><b>${euro(jobProfit(j))}</b></div><div><span class="muted">Pagamenti</span><br><b>${euro(jobPayments(j))}</b></div><div><span class="muted">Da incassare</span><br><b>${euro(jobToCollect(j))}</b></div><div><span class="muted">Stato incasso</span><br><b>${paymentStatus(j)}</b></div></div></div><div class="actions"><button class="secondary" onclick="editJob('${id}')">✏️ Modifica lavoro</button><button class="secondary" onclick="exportJobPDF('${id}')">📄 Esporta PDF</button><button class="danger" onclick="deleteJob('${id}')">🗑️ Elimina lavoro</button></div><div class="section">Interventi</div><div class="list">${ints.map(i=>{let sub=db.clients.find(c=>c.id===i.subclientId)||{};let hasAttachment=!!i.attachment?.data;return `<div class="item"><div class="row"><div><b>${esc(sub.name||'Nessun sottocliente')}</b><div class="muted">${esc(sub.city||'')}${sub.city&&sub.street?' · ':''}${esc(sub.street||'')}</div></div><div style="text-align:right"><div class="amount">${euro(i.cost)}</div><div class="muted">${esc(i.date||'')}</div></div></div><div class="muted" style="margin-top:7px">${esc(catName(i.catId))}${i.request?' · '+esc(i.request):''} ${hasAttachment?' · 📎':''}</div><div class="actions"><button class="secondary" onclick="editInt('${i.id}')">Apri / modifica</button><button class="secondary" onclick="exportIntPDF('${i.id}')">📄 PDF</button><button class="danger" onclick="deleteInt('${i.id}')">Elimina</button></div></div>`}).join('')||'<div class="empty">Nessun intervento.</div>'}</div><div class="section">Pagamenti ricevuti</div><div class="list">${db.payments.filter(p=>p.jobId===id).map(p=>`<div class="item"><div class="row"><span>${esc(p.date||'')}</span><span class="amount">${euro(p.amount)}</span></div><div class="muted">${esc(p.method||'')} ${p.note?'· '+esc(p.note):''}</div><div class="actions"><button class="secondary" onclick="editPayment('${p.id}')">Modifica</button><button class="danger" onclick="deletePayment('${p.id}')">Elimina</button></div></div>`).join('')||'<div class="empty">Nessun pagamento registrato.</div>'}</div><div class="actions"><button class="secondary" onclick="closeModal()">Chiudi</button><button class="primary" onclick="newInt('${id}')">＋ Intervento</button><button class="primary" onclick="addPayment('${id}')">＋ Pagamento</button></div>`)}
function editJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;modal(`<h2>Modifica lavoro</h2><div class="field"><label>Cliente</label><select id="ejc">${db.clients.map(c=>`<option value="${c.id}" ${c.id===j.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Data</label><input id="ejd" type="date" value="${esc(j.date)}"></div><div class="field"><label>Fattura</label><div class="row"><span class="muted">Il lavoro è fatturato?</span><input id="ejinv" type="checkbox" ${j.invoice?'checked':''} onchange="toggleInvoiceFields('ej')" style="width:24px;height:24px;flex:0 0 auto"></div></div><div id="ejinvoiceFields" class="${j.invoice?'':'hidden'}"><div class="field"><label>Fattura n°</label><input id="ejinvno" value="${esc(j.invoiceNo||'')}"></div><div class="field"><label>Data fattura</label><input id="ejinvdate" type="date" value="${esc(j.invoiceDate||'')}"></div><div class="field"><label>% accantonamento tasse</label><input id="ejtax" type="number" min="0" max="100" step="0.1" inputmode="decimal" value="${Number(j.taxRate)||0}"></div></div><div class="field"><label>Stato lavoro</label><select id="ejstatus">${['Aperto','In corso','Completato','Chiuso','Annullato'].map(x=>`<option ${x===(j.status||'Aperto')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fissa lavoro</label><div class="row"><span class="muted">Mostra il lavoro nella dashboard</span><input id="ejfixed" type="checkbox" ${j.fixed?'checked':''} style="width:24px;height:24px;flex:0 0 auto"></div></div><div class="actions"><button class="secondary" onclick="openJob('${id}')">Annulla</button><button class="primary" onclick="saveEditJob('${id}')">Salva modifiche</button></div>`)}
function saveEditJob(id){let j=db.jobs.find(x=>x.id===id),c=document.getElementById('ejc'),d=document.getElementById('ejd');if(!j||!c||!d||!d.value)return;let inv=!!document.getElementById('ejinv')?.checked;j.clientId=c.value;j.date=d.value;j.invoice=inv;j.invoiceNo=inv?(document.getElementById('ejinvno')?.value||''):'';j.invoiceDate=inv?(document.getElementById('ejinvdate')?.value||''):'';j.taxRate=inv?(Number(document.getElementById('ejtax')?.value)||0):0;j.fixed=!!document.getElementById('ejfixed')?.checked;j.status=document.getElementById('ejstatus')?.value||'Aperto';save();openJob(id)}
function deleteJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;if(!confirm(`Eliminare il lavoro #${j.num} e tutti i suoi interventi e spese?`))return;let intIds=db.interventions.filter(i=>i.jobId===id).map(i=>i.id);db.expenses=db.expenses.filter(e=>!intIds.includes(e.intId));db.interventions=db.interventions.filter(i=>i.jobId!==id);db.jobs=db.jobs.filter(x=>x.id!==id);save();closeModal();render()}
function setNowTime(id){let d=new Date(),v=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');let e=document.getElementById(id);if(e)e.value=v}
function newInt(jobId){if(!db.cats.length){alert('Prima inserisci almeno una categoria.');return}let j=db.jobs.find(x=>x.id===jobId),num=db.seqInt+1;if(!j)return;modal(`<h2>Nuovo intervento</h2><div class="card"><b>Cliente: ${esc(clientName(j.clientId))}</b></div><div class="field"><label>Data</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Orari</label><div class="row"><input id="istart" type="time"><input id="iend" type="time"></div><div class="actions"><button class="secondary" type="button" onclick="setNowTime('istart')">▶️ Inizia</button><button class="secondary" type="button" onclick="setNowTime('iend')">⏹️ Termina</button></div></div><div class="field"><label>Sottocliente</label><select id="isub"><option value="">— Nessuno —</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Categoria intervento</label><select id="icat" onchange="showCost()">${db.cats.map(c=>`<option value="${c.id}">${esc(c.code)} - ${esc(c.desc)}</option>`).join('')}</select></div><div class="field"><label>Costo intervento</label><input id="icost" readonly></div><div class="field"><label>Richiesta cliente</label><textarea id="ireq"></textarea></div><div class="field"><label>Lavoro svolto</label><textarea id="iwork"></textarea></div><div class="field"><label>File allegato</label><input id="ifile" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><div class="actions"><button class="secondary" onclick="openJob('${jobId}')">Annulla</button><button class="primary" onclick="saveInt('${jobId}',${num})">Salva intervento</button></div>`);showCost()}
function showCost(){const catEl=document.getElementById('icat'),costEl=document.getElementById('icost');if(!catEl||!costEl)return;let c=db.cats.find(c=>c.id===catEl.value);costEl.value=c?Number(c.amount).toFixed(2)+' €':''}
function readFileAsDataURL(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);let r=new FileReader();r.onload=()=>resolve({name:file.name,type:file.type||'application/octet-stream',data:r.result});r.onerror=reject;r.readAsDataURL(file)})}
async function saveInt(jobId,num){const dateEl=document.getElementById('idate'),startEl=document.getElementById('istart'),endEl=document.getElementById('iend'),subEl=document.getElementById('isub'),catEl=document.getElementById('icat'),reqEl=document.getElementById('ireq'),workEl=document.getElementById('iwork'),fileEl=document.getElementById('ifile');if(!dateEl||!catEl||!dateEl.value){alert('Compila i dati dell’intervento.');return}let c=db.cats.find(c=>c.id===catEl.value),start=startEl?.value||'',end=endEl?.value||'',mins='';if(start&&end){let a=new Date('2000-01-01T'+start),b=new Date('2000-01-01T'+end);let d=(b-a)/60000;if(d<0)d+=1440;mins=d}let file=await readFileAsDataURL(fileEl?.files?.[0]);db.seqInt=num;db.interventions.push({id:uid(),jobId,num,date:dateEl.value,start,end,minutes:mins,subclientId:subEl?.value||'',catId:catEl.value,cost:Number(c?.amount||0),request:reqEl?.value||'',work:workEl?.value||'',attachment:file});try{save()}catch(e){db.interventions.pop();alert('Il file è troppo grande per essere salvato nel browser. Prova con un PDF o un file più piccolo.');return}openJob(jobId)}
function openAttachment(id){let i=db.interventions.find(x=>x.id===id);let a=i?.attachment;if(!a?.data){alert('Nessun allegato disponibile.');return}try{let parts=a.data.split(','),mime=a.type||'application/octet-stream',raw=atob(parts[1]),u8=new Uint8Array(raw.length);for(let n=0;n<raw.length;n++)u8[n]=raw.charCodeAt(n);let url=URL.createObjectURL(new Blob([u8],{type:mime}));let w=window.open(url,'_blank');if(!w){let link=document.createElement('a');link.href=url;link.download=a.name||'allegato';document.body.appendChild(link);link.click();link.remove()}setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('Impossibile aprire l’allegato.')}}
function editInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let j=db.jobs.find(x=>x.id===i.jobId);modal(`<h2>Modifica intervento · ${esc(clientName(j.clientId))}</h2><div class="card"><b>Cliente: ${esc(clientName(j.clientId))}</b><div class="muted">Tempo: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'non calcolato'}</div></div><div class="field"><label>Data</label><input id="eidate" type="date" value="${esc(i.date)}"></div><div class="field"><label>Ora inizio</label><input id="eistart" type="time" value="${esc(i.start||'')}"></div><div class="field"><label>Ora fine</label><input id="eiend" type="time" value="${esc(i.end||'')}"></div><div class="field"><label>Sottocliente</label><select id="eisub"><option value="">— Nessuno —</option>${db.clients.map(c=>`<option value="${c.id}" ${c.id===i.subclientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Categoria intervento</label><select id="eicat" onchange="showEditCost()">${db.cats.map(c=>`<option value="${c.id}" ${c.id===i.catId?'selected':''}>${esc(c.code)} - ${esc(c.desc)}</option>`).join('')}</select></div><div class="field"><label>Costo intervento</label><input id="eicost" readonly></div><div class="field"><label>Richiesta cliente</label><textarea id="er">${esc(i.request)}</textarea></div><div class="field"><label>Lavoro svolto</label><textarea id="ew">${esc(i.work)}</textarea></div><div class="field"><label>Allegato</label>${i.attachment?.data?`<div class="item"><b>${esc(i.attachment.name)}</b><div class="actions"><button class="secondary" onclick="openAttachment('${id}')">📎 Apri allegato</button><button class="danger" onclick="removeAttachment('${id}')">Elimina allegato</button></div></div>`:'<div class="muted">Nessun allegato</div>'}<input id="eifile" type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"></div><div class="section">Spese</div><div class="list">${db.expenses.filter(e=>e.intId===id).map(e=>`<div class="item"><div class="row"><span>${esc(e.desc)}</span><span class="amount">${euro(e.amount)}</span></div><div class="actions"><button class="secondary" onclick="editExpense('${e.id}')">Modifica</button><button class="danger" onclick="deleteExpense('${e.id}')">Elimina</button></div></div>`).join('')||'<div class="muted">Nessuna spesa</div>'}</div><div class="actions"><button class="secondary" onclick="openJob('${i.jobId}')">Indietro</button><button class="secondary" onclick="exportIntPDF('${id}')">📄 Esporta PDF</button><button class="primary" onclick="addExpense('${id}')">＋ Spesa</button><button class="primary" onclick="saveEditInt('${id}')">Salva</button></div><div class="actions"><button class="danger" onclick="deleteInt('${id}')">🗑️ Elimina intervento</button></div>`);showEditCost()}
function showEditCost(){let c=db.cats.find(x=>x.id===document.getElementById('eicat')?.value);let el=document.getElementById('eicost');if(el)el.value=c?Number(c.amount).toFixed(2)+' €':''}
async function saveEditInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let date=document.getElementById('eidate'),start=document.getElementById('eistart'),end=document.getElementById('eiend'),sub=document.getElementById('eisub'),cat=document.getElementById('eicat'),req=document.getElementById('er'),work=document.getElementById('ew'),file=document.getElementById('eifile');if(!date?.value||!cat?.value)return;let mins='';if(start?.value&&end?.value){let a=new Date('2000-01-01T'+start.value),b=new Date('2000-01-01T'+end.value),d=(b-a)/60000;if(d<0)d+=1440;mins=d}i.date=date.value;i.start=start?.value||'';i.end=end?.value||'';i.minutes=mins;i.subclientId=sub?.value||'';i.catId=cat.value;i.cost=Number(db.cats.find(c=>c.id===cat.value)?.amount||0);i.request=req?.value||'';i.work=work?.value||'';let f=await readFileAsDataURL(file?.files?.[0]);if(f)i.attachment=f;try{save()}catch(e){alert('Il file è troppo grande per essere salvato.');return}editInt(id)}
function removeAttachment(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(confirm('Eliminare questo allegato?')){i.attachment=null;save();editInt(id)}}
function deleteInt(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;if(!confirm(`Eliminare l'intervento #${i.num} e tutte le sue spese?`))return;db.expenses=db.expenses.filter(e=>e.intId!==id);db.interventions=db.interventions.filter(x=>x.id!==id);save();openJob(i.jobId)}

function editExpense(id){let e=db.expenses.find(x=>x.id===id);if(!e)return;modal(`<h2>Modifica spesa</h2><div class="field"><label>Descrizione</label><input id="edesc" value="${esc(e.desc)}"></div><div class="field"><label>Importo</label><input id="eamount" type="number" step="0.01" inputmode="decimal" value="${Number(e.amount)||0}"></div><div class="actions"><button class="secondary" onclick="editInt('${e.intId}')">Annulla</button><button class="primary" onclick="saveEditedExpense('${id}')">Salva</button></div>`)}

function cp1252Bytes(str){const map={'€':0x80,'‚':0x82,'ƒ':0x83,'„':0x84,'…':0x85,'†':0x86,'‡':0x87,'ˆ':0x88,'‰':0x89,'Š':0x8A,'‹':0x8B,'Œ':0x8C,'Ž':0x8E,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97,'˜':0x98,'™':0x99,'š':0x9A,'›':0x9B,'œ':0x9C,'ž':0x9E,'Ÿ':0x9F};let a=[];for(const ch of String(str)){const c=ch.charCodeAt(0);a.push(map[ch]??(c<=255?c:63));}return new Uint8Array(a)}
function asciiBytes(str){return new TextEncoder().encode(str)}
function concatBytes(parts){let n=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(n),i=0;for(const p of parts){o.set(p,i);i+=p.length}return o}
function pdfEscape(str){return String(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function wrapPdfLine(str,max=88){let s=String(str??'').replace(/\s+/g,' ').trim();if(!s)return [''];let out=[];while(s.length>max){let cut=s.lastIndexOf(' ',max);if(cut<30)cut=max;out.push(s.slice(0,cut));s=s.slice(cut).trim()}if(s)out.push(s);return out}
function buildPdf(title,lines,imgBytes,imgW=853,imgH=178){
  const W=595,H=842,margin=42,leading=15,maxChars=88,pages=[];let cur=[];let y=H-margin;
  function addLine(text,size=10,bold=false,indent=0){for(const ln of wrapPdfLine(text,maxChars)){if(y<55){pages.push(cur);cur=[];y=H-margin}cur.push({text:ln,size,bold,x:margin+indent,y});y-=leading+(size>12?3:0)}}
  if(imgBytes){cur.push({image:true,x:margin,y:748,w:300,h:62});y=720}
  addLine(title,18,true);y-=4;
  for(const line of lines){if(line===''){y-=7;continue}if(line.startsWith('## ')){y-=4;addLine(line.slice(3),13,true)}else if(line.startsWith('### ')){addLine(line.slice(4),11,true)}else addLine(line,10,false)}
  if(cur.length)pages.push(cur);
  const objs=[]; const put=(b)=>{objs.push(b);return objs.length};
  put(asciiBytes('<< /Type /Catalog /Pages 2 0 R >>')); // 1
  put(null); // 2 pages later
  put(asciiBytes('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>')); //3
  let imgObj=0;if(imgBytes){imgObj=put(concatBytes([asciiBytes(`<< /Type /XObject /Subtype /Image /Width ${imgW} /Height ${imgH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imgBytes.length} >>\nstream\n`),imgBytes,asciiBytes('\nendstream')]));}
  const pageRefs=[];
  for(const page of pages){let contentParts=[];if(page.some(x=>x.image)){contentParts.push(asciiBytes(`q ${page.find(x=>x.image).w} 0 0 ${page.find(x=>x.image).h} ${page.find(x=>x.image).x} ${page.find(x=>x.image).y} cm /Im1 Do Q\n`))}for(const item of page){if(item.image)continue;let font=item.bold?13:item.size;contentParts.push(cp1252Bytes(`BT /F1 ${font} Tf ${item.x} ${item.y} Td (${pdfEscape(item.text)}) Tj ET\n`))}let stream=concatBytes(contentParts);let c=put(concatBytes([asciiBytes(`<< /Length ${stream.length} >>\nstream\n`),stream,asciiBytes('endstream')]));let res=`<< /Font << /F1 3 0 R >>`;if(imgObj)res+=` /XObject << /Im1 ${imgObj} 0 R >>`;res+=' >>';let p=put(asciiBytes(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources ${res} /Contents ${c} 0 R >>`));pageRefs.push(p)}
  objs[1]=asciiBytes(`<< /Type /Pages /Kids [${pageRefs.map(n=>n+' 0 R').join(' ')}] /Count ${pageRefs.length} >>`);
  let header=asciiBytes('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'),chunks=[header],offsets=[0],pos=header.length;for(let i=0;i<objs.length;i++){let pre=asciiBytes(`${i+1} 0 obj\n`),body=objs[i],post=asciiBytes('\nendobj\n');offsets.push(pos);chunks.push(pre,body,post);pos+=pre.length+body.length+post.length}let xrefPos=pos;let xref=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<=objs.length;i++)xref+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';xref+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;chunks.push(asciiBytes(xref));return concatBytes(chunks)
}
async function fetchLogoBytes(){try{let r=await fetch('logo.jpeg',{cache:'no-store'});if(!r.ok)return null;return new Uint8Array(await r.arrayBuffer())}catch(_){return null}}
async function downloadPDF(title,lines){let img=await fetchLogoBytes();let bytes=buildPdf(title,lines,img);let blob=new Blob([bytes],{type:'application/pdf'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=(title||'documento').replace(/[^a-z0-9àèéìòù _-]/gi,'').replace(/\s+/g,'-')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
async function exportJobPDF(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;let ints=db.interventions.filter(i=>i.jobId===id).sort((a,b)=>b.date.localeCompare(a.date)||((Number(b.num)||0)-(Number(a.num)||0)));let lines=[`Cliente: ${clientName(j.clientId)}`,`Data lavoro: ${j.date}`,`Fattura: ${j.invoice?'Sì':'No'}`];if(j.invoice){lines.push(`Fattura n°: ${j.invoiceNo||'—'}`,`Data fattura: ${j.invoiceDate||'—'}`,`Accantonamento: ${Number(j.taxRate)||0}%`)}lines.push('','## Interventi');for(const i of ints){let s=db.clients.find(c=>c.id===i.subclientId)||{},ex=db.expenses.filter(e=>e.intId===i.id);lines.push(`### ${i.date} · ${s.name||'Nessun sottocliente'} · ${s.city||''}${s.city&&s.street?' · ':''}${s.street||''}`,`Categoria: ${catName(i.catId)} · Importo: ${euro(i.cost)}`,`Tempo: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'—'}`,`Richiesta: ${i.request||'—'}`,`Lavoro svolto: ${i.work||'—'}`);if(i.attachment?.name)lines.push(`Allegato: ${i.attachment.name}`);if(ex.length){lines.push('Spese:');for(const e of ex)lines.push(`- ${e.desc}: ${euro(e.amount)}`)}lines.push('')}lines.push('## Riepilogo',`Totale interventi: ${euro(jobTotal(j))}`,`Totale spese: ${euro(jobExpenses(j))}`,`Accantonamento tasse: ${euro(jobTax(j))}`,`Guadagno: ${euro(jobProfit(j))}`,`Pagamenti ricevuti: ${euro(jobPayments(j))}`,`Da incassare: ${euro(jobToCollect(j))}`);await downloadPDF(`Lavoro-${clientName(j.clientId)}`,lines)}
async function exportIntPDF(id){let i=db.interventions.find(x=>x.id===id);if(!i)return;let j=db.jobs.find(x=>x.id===i.jobId)||{},s=db.clients.find(c=>c.id===i.subclientId)||{},es=db.expenses.filter(e=>e.intId===id);let lines=[`Cliente: ${clientName(j.clientId)}`,`Data: ${i.date}`,`Sottocliente: ${s.name||'Nessuno'}`,`Città/Via: ${s.city||''}${s.city&&s.street?' · ':''}${s.street||''}`,`Categoria: ${catName(i.catId)}`,`Importo: ${euro(i.cost)}`,`Ora: ${i.start||'—'} - ${i.end||'—'}`,`Tempo lavorato: ${i.minutes!==''?Math.floor(i.minutes/60)+'h '+(i.minutes%60)+'m':'—'}`,'','## Richiesta cliente',i.request||'—','','## Lavoro svolto',i.work||'—','','## Spese'];for(const e of es)lines.push(`- ${e.desc}: ${euro(e.amount)}`);if(!es.length)lines.push('Nessuna spesa');if(i.attachment?.name)lines.push('','Allegato: '+i.attachment.name);await downloadPDF(`Intervento-${i.num}-${clientName(j.clientId)}`,lines)}
function exportDB(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-gestionale.json';a.click()}
function importDB(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.interventions)||!Array.isArray(x.clients)){throw new Error('struttura')}db={clients:x.clients||[],cats:x.cats||[],jobs:x.jobs||[],interventions:x.interventions||[],expenses:x.expenses||[],payments:x.payments||[],seqJob:x.seqJob||0,seqInt:x.seqInt||0};save();render();alert('Backup importato correttamente.')}catch(_){alert('Backup non valido o danneggiato.')}};r.readAsText(f)}
document.addEventListener('DOMContentLoaded',()=>{const tabs=document.querySelectorAll('.tabs button');tabs.forEach(b=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}));const search=document.getElementById('globalSearch');if(search)search.addEventListener('input',()=>{if(search.value.trim())searchResults();else render()});const fab=document.getElementById('fab');if(fab){fab.onclick=null;fab.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();newJob();});}document.addEventListener('click',function(ev){const b=ev.target.closest&&ev.target.closest('#newJobBtn');if(b){ev.preventDefault();newJob();}});const modalEl=document.getElementById('modal');if(modalEl)modalEl.addEventListener('click',e=>{if(e.target===modalEl)closeModal()});render();});
